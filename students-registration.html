<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تسجيل الطلاب الإلكتروني — جامعة زالنجي</title>
<meta name="theme-color" content="#0B5D3B">
<script>
  // تطبيق الوضع الليلي/النهاري المحفوظ فورًا قبل أي رسم للصفحة، تفاديًا لوميض
  // لحظي بالوضع الخاطئ عند التحميل (نفس فكرة الأنظمة الاحترافية المشابهة).
  (function(){
    try{
      var saved = localStorage.getItem('zu_theme');
      if(saved==='dark') document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();
</script>
<!-- مكتبة Supabase JS اختيارية بالكامل: تُستخدم فقط لتفعيل "المزامنة السحابية" من
     صفحة الإعدادات. إن تعذّر تحميلها (لا إنترنت) يستمر النظام بالعمل محليًا بالكامل
     دون أي تأثير — كل الشيفرة التي تستخدمها محروسة بفحص `window.supabase`. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --navy:#0B5D3B; --navy-2:#0E7A4C; --gold:#C79A3D; --gold-light:#E3BE63;
    --paper:#F8F7F2; --paper-2:#EEF3EC; --ink:#1E2620; --ink-soft:#5C6A5F;
    --line:#D8E0D5; --good:#2F7D4F; --warn:#B34A36; --mid:#8A6516; --shadow:0 10px 34px rgba(11,93,59,.14);
    --surface:#fff;
  }
  :root[data-theme="dark"]{
    --navy:#0E7A4C; --navy-2:#12945C; --gold:#D9AE54; --gold-light:#EAC978;
    --paper:#12181A; --paper-2:#1B2426; --ink:#E7EDE9; --ink-soft:#9FB0A6;
    --line:#2B3A38; --good:#3FA870; --warn:#E0705A; --mid:#D9AE54; --shadow:0 10px 34px rgba(0,0,0,.45);
    --surface:#1A2325;
  }
  :root[data-theme="dark"] body{
    background:
      radial-gradient(1000px 520px at 92% -8%, rgba(199,154,61,.06), transparent 60%),
      radial-gradient(900px 500px at -5% 105%, rgba(11,93,59,.10), transparent 55%),
      var(--paper);
  }
  :root[data-theme="dark"] .slip-doc{background:#fff;color:#1E2620;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1000px 520px at 92% -8%, rgba(199,154,61,.12), transparent 60%),
      radial-gradient(900px 500px at -5% 105%, rgba(11,93,59,.08), transparent 55%),
      var(--paper);
    color:var(--ink); font-family:'Segoe UI','Tahoma',Arial,sans-serif; min-height:100vh;
  }
  *:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  a{color:var(--navy);}

  /* ===== Auth screens ===== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{
    width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:30px 26px;border-top:4px solid var(--gold);
  }
  .auth-seal{width:78px;height:78px;border-radius:50%;border:2px solid var(--gold);margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:900;font-size:26px;background:var(--paper-2);overflow:hidden;}
  .auth-seal img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .auth-card h1{text-align:center;font-size:20px;color:var(--navy);margin:0 0 4px;}
  .auth-card p.sub{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 20px;line-height:1.7;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  input,select,textarea{
    font-family:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:14.5px;background:var(--paper);color:var(--ink);outline:none;width:100%;
    min-height:44px;
  }
  textarea{min-height:80px;resize:vertical;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);background:var(--surface);}
  input:disabled,select:disabled{opacity:.65;cursor:not-allowed;}
  .err-text{color:var(--warn);font-size:12.5px;margin-top:-8px;margin-bottom:10px;display:none;}
  .err-text.show{display:block;}
  .ok-text{color:var(--good);font-size:12.5px;margin-top:-8px;margin-bottom:10px;display:none;}
  .ok-text.show{display:block;}
  .btn{
    padding:11px 18px;border:1px solid var(--navy);border-radius:8px;background:var(--navy);color:#fff;
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;
    transition:background .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover{background:var(--navy-2);box-shadow:0 4px 14px rgba(11,93,59,.25);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
  .btn-block{width:100%;}
  .btn-gold{background:var(--gold);border-color:var(--gold);}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-outline{background:transparent;color:var(--navy);}
  .btn-outline:hover{background:var(--paper-2);}
  .btn-danger{background:transparent;border-color:var(--warn);color:var(--warn);}
  .btn-danger:hover{background:var(--warn);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
  .dev-credit{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  .hint-box{background:var(--paper-2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.8;}
  .hint-box.warn-box{background:#FBEDEA;color:#8A2F1E;}
  .hint-box.good-box{background:#E7F3EC;color:#1C5B3B;}
  .hint-box.mid-box{background:#FBF1DC;color:#7A5A12;}

  .segmented{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px;}
  .segmented button{flex:1;border:none;background:var(--surface);padding:11px 6px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-inline-start:1px solid var(--line);min-height:44px;}
  .segmented button:first-child{border-inline-start:none;}
  .segmented button.active{background:var(--navy);color:#fff;}

  /* ===== App shell ===== */
  #shell{display:none;min-height:100vh;flex-direction:column;}
  header.topbar{
    background:linear-gradient(135deg, var(--navy), var(--navy-2));color:#fff;padding:12px 20px;display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow);position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .badge{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);display:flex;
    align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--gold-light);flex-shrink:0;overflow:hidden;}
  .brand .badge img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .brand b{font-size:15.5px;display:block;}
  .brand span.tagline{font-size:11px;opacity:.85;}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;}
  .who .role-pill{background:rgba(184,145,47,.22);border:1px solid var(--gold);color:var(--gold-light);
    padding:3px 10px;border-radius:20px;font-size:11.5px;white-space:nowrap;}

  .topbar-tools{display:flex;align-items:center;gap:8px;}
  .search-trigger{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    color:#fff;border-radius:20px;padding:7px 14px;font-family:inherit;font-size:12.5px;cursor:pointer;min-height:36px;}
  .search-trigger:hover{background:rgba(255,255,255,.2);}
  .bell-btn{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:50%;width:36px;height:36px;min-height:36px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .bell-btn:hover{background:rgba(255,255,255,.2);}
  .bell-dot{position:absolute;top:-3px;left:-3px;background:var(--warn);color:#fff;font-size:9.5px;font-weight:800;
    min-width:16px;height:16px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--navy);}
  .notif-panel{position:fixed;top:64px;left:16px;width:320px;max-width:92vw;max-height:70vh;overflow-y:auto;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);z-index:150;display:none;}
  .notif-panel.show{display:block;}
  .notif-panel .np-head{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy);font-size:13.5px;}
  .notif-item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;line-height:1.7;position:relative;}
  .notif-item:hover{background:var(--paper-2);}
  .notif-item .ni-t{color:var(--ink-soft);font-size:11px;}
  .notif-item.unread{background:var(--paper-2);font-weight:800;}
  .notif-item.unread .ni-label{padding-inline-start:14px;position:relative;}
  .notif-item.unread .ni-label::before{content:'';position:absolute;inline-size:7px;block-size:7px;border-radius:50%;background:var(--gold);inset-inline-start:0;top:6px;}
  .notif-item.read{opacity:.72;font-weight:400;}
  .search-modal-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:14px;}
  .search-group-title{font-size:11.5px;color:var(--gold);font-weight:800;letter-spacing:.5px;margin:14px 0 6px;text-transform:uppercase;}
  .search-result-item{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .search-result-item:hover{background:var(--paper-2);}

  nav.tabs{
    background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 14px;
    overflow-x:auto;position:sticky;top:66px;z-index:19;
  }
  nav.tabs button{
    background:none;border:none;padding:13px 14px;font-family:inherit;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px;
  }
  nav.tabs button.active{color:var(--navy);border-bottom-color:var(--gold);}
  nav.tabs button:hover{color:var(--navy);}

  main#viewport{flex:1;padding:22px 18px 60px;max-width:1180px;margin:0 auto;width:100%;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px;margin-bottom:20px;border-top:3px solid var(--gold);}
  .card h2{font-size:18px;color:var(--navy);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card h3{font-size:15px;color:var(--navy);margin:0 0 10px;}
  .eyebrow{font-size:11px;letter-spacing:1px;color:var(--gold);font-weight:800;text-transform:uppercase;}
  .greet{font-size:15px;color:var(--ink);margin-bottom:4px;}
  .muted{color:var(--ink-soft);font-size:12.5px;}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .row .field{flex:1;min-width:160px;}
  .row2{display:flex;gap:16px;flex-wrap:wrap;}
  .row2 > div{flex:1;min-width:240px;}
  .checkrow{display:flex;align-items:center;gap:6px;}
  .checkrow input{width:auto;min-height:auto;}
  .checkrow label{margin:0;}

  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.3px;}
  thead th{text-align:right;font-size:11.8px;color:var(--ink-soft);font-weight:700;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap;}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--paper-2);}
  td.fit,th.fit{width:1%;white-space:nowrap;}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--paper-2);color:var(--ink-soft);}
  .pill-good{background:#E4F3EA;color:#1C6B41;}
  .pill-warn{background:#FBEDEA;color:#9B3A26;}
  .pill-gold{background:#FBF1DC;color:#8A6516;}
  .pill-navy{background:#E3EEE8;color:var(--navy);}
  .pill-mid{background:#FDF4E3;color:var(--mid);}

  .icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 6px;color:var(--ink-soft);min-height:auto;}
  .icon-btn:hover{color:var(--navy);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);border-inline-start:4px solid var(--gold);cursor:pointer;display:flex;align-items:center;gap:12px;}
  .stat-card:hover{border-color:var(--gold);transform:translateY(-1px);}
  .stat-card .stat-icon{font-size:22px;line-height:1;flex:none;width:42px;height:42px;border-radius:10px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;}
  .stat-card .stat-body{min-width:0;}
  .stat-card .n{font-size:24px;font-weight:900;color:var(--navy);}
  .stat-card .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .bar-outer{background:var(--paper-2);border-radius:8px;height:10px;overflow:hidden;width:100%;}
  .bar-inner{background:linear-gradient(90deg,var(--navy),var(--navy-2));height:100%;border-radius:8px;}
  .bar-inner.full{background:linear-gradient(90deg,var(--warn),#d9705b);}
  .stack-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--paper-2);gap:2px;}
  .stack-seg{height:100%;min-width:2px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .icon{font-size:40px;margin-bottom:10px;}
  .empty-state h3{color:var(--navy);margin:0 0 6px;font-size:16px;}

  .offering-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;}
  .offering-card.disabled{opacity:.55;}
  .offering-main{flex:1;min-width:220px;}
  .offering-main .cname{font-weight:800;color:var(--navy);font-size:14.5px;}
  .offering-main .cmeta{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.9;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,30,24,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:14px;max-width:580px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:16px;color:var(--navy);}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);min-height:auto;}
  .modal-body{padding:20px;overflow-y:auto;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}

  /* Toast */
  #toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;padding:12px 22px;
    border-radius:30px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;z-index:200;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;bottom:32px;}
  #toast.err{background:var(--warn);}

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;right:0;left:0;padding:20px;}
  }
  /* ===== وثيقة إشعار التسجيل القابلة للطباعة ===== */
  .slip-doc{position:relative;max-width:800px;margin:0 auto;font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;
    border:3px double var(--navy);border-radius:10px;padding:26px 30px;overflow:hidden;background:#fff;}
  .slip-watermark{position:absolute;inset:-20%;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;
    transform:rotate(-30deg);opacity:.07;pointer-events:none;z-index:0;}
  .slip-watermark span{font-size:22px;font-weight:800;color:var(--navy);white-space:nowrap;margin:18px 26px;}
  .slip-doc > *{position:relative;z-index:1;}
  .slip-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:14px;}
  .slip-head img{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;}
  .slip-head .titles{flex:1;text-align:center;}
  .slip-head .titles h2{margin:0 0 4px;color:var(--navy);font-size:19px;}
  .slip-head .titles .sub{font-size:12px;color:var(--ink-soft);}
  .slip-serial{font-size:11px;color:var(--ink-soft);text-align:left;}
  .slip-id-block{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;background:var(--paper-2);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;}
  .slip-id-block b{color:var(--navy);}
  .slip-table{width:100%;border-collapse:collapse;margin-top:6px;}
  .slip-table th{background:#EEF3EC;border:1px solid #ccc;padding:6px;font-size:12.5px;}
  .slip-table td{border:1px solid #ccc;padding:6px;font-size:12.5px;}
  .slip-foot{margin-top:20px;font-size:11px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}

  @media (max-width:640px){
    header.topbar{padding:10px 12px;}
    main#viewport{padding:16px 10px 50px;}
    .card{padding:16px;}
    .search-trigger span.st-label{display:none;}
  }
</style>
</head>
<body>

<!-- ============== شاشات الدخول ============== -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-card" id="authCard"></div>
</div>

<!-- ============== هيكل التطبيق ============== -->
<div id="shell">
  <header class="topbar">
    <div class="brand">
      <div class="badge" id="brandBadge"></div>
      <div>
        <b>جامعة زالنجي</b>
        <span class="tagline">نظام تسجيل الطلاب الإلكتروني</span>
      </div>
    </div>
    <div class="topbar-tools">
      <button class="search-trigger" onclick="openSearchModal()"><span>🔍</span><span class="st-label">بحث... (Ctrl+K)</span></button>
      <button class="bell-btn" id="themeToggleBtn" onclick="toggleDarkMode()" title="تبديل الوضع الليلي/النهاري">🌙</button>
      <button class="bell-btn" id="bellBtn" onclick="toggleNotifPanel(event)">🔔<span class="bell-dot" id="bellDot" style="display:none;">0</span></button>
    </div>
    <div class="who">
      <span id="whoName"></span>
      <span class="role-pill" id="whoRole"></span>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">خروج</button>
    </div>
  </header>
  <nav class="tabs" id="tabsNav"></nav>
  <main id="viewport"></main>
</div>

<div class="notif-panel" id="notifPanel"></div>

<!-- ============== نافذة منبثقة عامة ============== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toast"></div>
<div id="printArea"></div>

<script>
/* =========================================================================
   نظام تسجيل الطلاب الإلكتروني — جامعة زالنجي
   يعمل بالكامل محليًا (IndexedDB) دون الحاجة لاتصال إنترنت أو خادم خلفي،
   ومبني ليتوافق في الهوية البصرية وقائمة الكليات وشكل بيانات الطلاب مع
   "نظام السجل الأكاديمي الإلكتروني" المرجعي لنفس الجامعة.

   قواعد العمل المُطبَّقة (بحسب توضيحات إدارة القبول والتسجيل):
   1) القبول قرار مسبق من وزارة التعليم العالي (رقم جامعي + اسم + مدرسة ثانوية) —
      لا يوجد "تقديم طلب قبول" من الطالب؛ الموظف يُدخل/يستورد كشوفات القبول.
   2) رقم التسجيل (رقم القيد) يُولَّد تلقائيًا بالصيغة: تسلسل-رمزالقسم-سنةالقبول
      (مثال: 2-ن-22)، والتسلسل يبدأ من 1 ويُعاد لكل قسم مع كل سنة قبول جديدة،
      لكن الرقم الكامل لا يتكرر أبدًا ويبقى ثابتًا للطالب طوال دراسته.
   3) عدد الساعات ليس اختياريًا: لكل قسم/تخصص منهج دراسي ثابت لكل مستوى (تبويب
      «المناهج الدراسية»)، والطالب عند التسجيل "يتقدّم" تلقائيًا لمقررات مستواه
      الحالي دون اختيار حر — بضغطة زر واحدة "تسجيل الفصل القادم".
   0) النظام يعمل محليًا أولًا (Offline-first) عبر IndexedDB دائمًا. ربط اختياري
      بمشروع Supabase من صفحة "الإعدادات" يفعّل مزامنة سحابية تلقائية في الخلفية
      بين عدة أجهزة (راجع قسم "المزامنة السحابية" في الكود وملف supabase_schema.sql).
   4) قبل تسجيل فصل جديد يجب ألا يكون على الطالب أي مانع من الآتي:
        - نتيجة الفصل السابق (تُستورد من ملف إكسل: ناجح / ملحق / غير مسموح
          بالتسجيل) — النجاح يُرقّي مستوى الطالب تلقائيًا؛ يُفحص فصلان سابقان
          بدلًا من فصل واحد إذا كانت نتيجة آخر فصل "ملحق".
        - عائق "حالة غش" أو "عائق مالي" — عوائق مستقلة يُسجّلها الموظف يدويًا
          على سجل الطالب (تجميد) ولا تُرفع إلا بإجراء "فك تجميد" صريح من الموظف.
   5) تسجيل المقررات يتطلب إرفاق رقم الإيصال المالي وصورة/ملف إشعار التوريد،
      ويبقى طلب التسجيل "قيد المراجعة" حتى يعتمده موظف القبول والتسجيل.
   ========================================================================= */

function collegeLabel(key){ const c = COLLEGES.find(x=>x.key===key); return c ? c.label : (key || 'غير محدد'); }
function collegeOptionsHtml(selected, withEmpty){
  return (withEmpty?'<option value="">— اختر الكلية —</option>':'') +
    COLLEGES.map(c=>`<option value="${c.key}" ${selected===c.key?'selected':''}>${c.label}</option>`).join('');
}

/* ==================== أسماء الفصول الدراسية والسنوات الأكاديمية بالعربية ==================== */
const SEMESTER_ORDINALS = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر'];
function semesterOrdinalWord(n){ n=parseInt(n,10)||1; return SEMESTER_ORDINALS[n-1] || ('رقم '+n); }
function semesterLabel(n){ return 'الفصل الدراسي '+semesterOrdinalWord(n); }
const YEAR_ORDINALS = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة'];
function academicYearNumber(n){ n=parseInt(n,10)||1; return Math.ceil(n/2); }
function yearOrdinalWord(n){ n=parseInt(n,10)||1; return YEAR_ORDINALS[n-1] || ('رقم '+n); }
function yearLabel(n){ return 'السنة '+yearOrdinalWord(academicYearNumber(n)); }

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
/* تجزئة نصية بسيطة غير تشفيرية (FNV-1a مبسّطة) — تُستخدم فقط لتوليد رمز/رقم
   مرجعي مختصر يبدو كرمز تحقّق على الوثائق المطبوعة (ليست حماية فعلية). */
function simpleHash(str){
  str = String(str||'');
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h>>>0);
}
function docSerialCode(prefix, parts){
  const h = simpleHash(parts.join('|')).toString(36).toUpperCase().padStart(6,'0').slice(-6);
  const h2 = simpleHash(parts.join('|')+'#'+h).toString(36).toUpperCase().padStart(4,'0').slice(-4);
  return `${prefix}-${h}-${h2}`;
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

}

function fmtDateTime(iso){ if(!iso) return '—'; try{ const d=new Date(iso); return d.toLocaleString('ar-EG'); }catch(e){ return iso; } }

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime||'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();

}

/* ==================== كاتب ملفات XLSX بسيط (بدون أي مكتبة خارجية) ====================
   نظير مطابق لقارئ xlsx/zip الموجود أعلاه (parseXlsxFile/unzipEntries/inflateRaw)
   لكن بالاتجاه المعاكس: يبني أرشيف ZIP بطريقة STORE (بدون ضغط، method=0) يحوي
   حزمة OOXML دنيا صالحة يفتحها Excel مباشرة — بدون sharedStrings.xml (نستخدم
   inlineStr لكل خلية نصية لتفادي أخطاء الفهرسة والإبقاء على الكود بسيطًا). */
function crc32(bytes){
  if(!crc32.__table){
    const table = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++){ c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); }
      table[n] = c>>>0;
    }
    crc32.__table = table;
  }
  const table = crc32.__table;
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){ crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8); }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
/* أرشيف ZIP بطريقة STORE (بدون ضغط) — تُطابق الحد الأدنى الذي يفهمه قارئ xlsx
   الموجود أعلاه في هذا الملف: تواقيع PK صحيحة، رؤوس ملفات محلية + دليل مركزي
   + سجل EOCD، وحجم مضغوط = حجم غير مضغوط (method=0). entries: [{name, data:Uint8Array}] */
function buildZipStored(entries){
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  const dosTime = 0, dosDate = 0x21; // تاريخ/وقت رمزي ثابت — غير مهم لصلاحية الملف
  for(const entry of entries){
    const nameBytes = encoder.encode(entry.name);
    const data = entry.data;
    const crc = crc32(data);
    const size = data.length;

    const localHeader = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(localHeader.buffer);
    lv.setUint32(0, 0x04034b50, true);   // Local file header signature
    lv.setUint16(4, 20, true);           // version needed
    lv.setUint16(6, 0, true);            // flags
    lv.setUint16(8, 0, true);            // method = 0 (STORE)
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);        // compressed size
    lv.setUint32(22, size, true);        // uncompressed size
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);           // extra length
    localHeader.set(nameBytes, 30);

    localParts.push(localHeader, data);
    const localHeaderOffset = offset;
    offset += localHeader.length + data.length;

    const centralHeader = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(centralHeader.buffer);
    cv.setUint32(0, 0x02014b50, true);   // Central directory signature
    cv.setUint16(4, 20, true);           // version made by
    cv.setUint16(6, 20, true);           // version needed
    cv.setUint16(8, 0, true);            // flags
    cv.setUint16(10, 0, true);           // method = 0 (STORE)
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);        // compressed size
    cv.setUint32(24, size, true);        // uncompressed size
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);           // extra length
    cv.setUint16(32, 0, true);           // comment length
    cv.setUint16(34, 0, true);           // disk number start
    cv.setUint16(36, 0, true);           // internal attrs
    cv.setUint32(38, 0, true);           // external attrs
    cv.setUint32(42, localHeaderOffset, true);
    centralHeader.set(nameBytes, 46);
    centralParts.push(centralHeader);
  }
  const centralDirOffset = offset;
  let centralSize = 0;
  centralParts.forEach(p=> centralSize += p.length);

  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);     // End of central directory signature
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralDirOffset, true);
  ev.setUint16(20, 0, true);             // comment length

  const totalSize = offset + centralSize + eocd.length;
  const out = new Uint8Array(totalSize);
  let p = 0;
  for(const part of localParts){ out.set(part, p); p += part.length; }
  for(const part of centralParts){ out.set(part, p); p += part.length; }
  out.set(eocd, p);
  return out;
}
function __xlsxEscapeXml(v){
  return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
function __xlsxColLetter(n){
  let s=''; n=n+1;
  while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); }
  return s;
}
function downloadXlsx(filename, headerRow, dataRows){
  const encoder = new TextEncoder();
  const allRows = [headerRow, ...dataRows];
  const rowsXml = allRows.map((row,ri)=>{
    const r = ri+1;
    const cellsXml = row.map((val,ci)=>{
      const ref = __xlsxColLetter(ci)+r;
      if(typeof val === 'number' && isFinite(val)){
        return `<c r="${ref}"><v>${val}</v></c>`;
      }
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${__xlsxEscapeXml(val)}</t></is></c>`;
    }).join('');
    return `<row r="${r}">${cellsXml}</row>`;
  }).join('');

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`;
  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const workbookRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowsXml}</sheetData></worksheet>`;

  const entries = [
    {name:'[Content_Types].xml', data: encoder.encode(contentTypesXml)},
    {name:'_rels/.rels', data: encoder.encode(rootRelsXml)},
    {name:'xl/workbook.xml', data: encoder.encode(workbookXml)},
    {name:'xl/_rels/workbook.xml.rels', data: encoder.encode(workbookRelsXml)},
    {name:'xl/worksheets/sheet1.xml', data: encoder.encode(sheetXml)},
  ];
  const zipBytes = buildZipStored(entries);
  const blob = new Blob([zipBytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function toggleDarkMode(){
  const root = document.documentElement;

  else{ root.setAttribute('data-theme','dark'); try{ localStorage.setItem('zu_theme','dark'); }catch(e){} }
  syncThemeToggleIcon();
}

/* ==================== قراءة ملفات إكسل (xlsx) وCSV محليًا بدون أي مكتبات خارجية ====================
   (كشوفات القبول ونتائج الفصول) — القراءة تتم بالكامل داخل المتصفح دون اتصال
   إنترنت، باستخدام واجهات المتصفح الأساسية فقط (DecompressionStream لفك ضغط
   DEFLATE داخل ملف xlsx، وDOMParser لقراءة XML) — لا اعتماد على أي CDN خارجي. */
async function readSpreadsheetRows(file){
  const name = (file.name||'').toLowerCase();
  if(name.endsWith('.csv') || file.type==='text/csv'){
    return parseCsvText(await file.text());
  }
  if(name.endsWith('.xls')){
    return parseXlsFile(file);
  }
  return parseXlsxFile(file);
}
function parseCsvText(text){
  text = text.replace(/^﻿/, '');
  const lines = text.split(/\r\n|\r|\n/).filter(l=>l.length>0);
  if(!lines.length) return [];
  const parseLine = (line)=>{
    const cells=[]; let cur=''; let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(inQuotes){
        if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQuotes=false; } }
        else cur+=ch;
      } else {
        if(ch==='"') inQuotes=true;
        else if(ch===','){ cells.push(cur); cur=''; }
        else cur+=ch;
      }
    }
    cells.push(cur);
    return cells;
  };
  const header = parseLine(lines[0]).map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = parseLine(line);
    const obj={};
    header.forEach((h,i)=> obj[h]=cells[i]!==undefined?cells[i]:'');
    return obj;
  });
}
async function parseXlsxFile(file){
  const bytes = new Uint8Array(await file.arrayBuffer());
  const entries = await unzipEntries(bytes);
  const decoder = new TextDecoder('utf-8');
  const sharedStringsXml = entries['xl/sharedStrings.xml'] ? decoder.decode(entries['xl/sharedStrings.xml']) : null;
  const sharedStrings = sharedStringsXml ? parseSharedStrings(sharedStringsXml) : [];
  const sheetName = Object.keys(entries).find(k=>/^xl\/worksheets\/sheet1\.xml$/i.test(k)) || Object.keys(entries).find(k=>/^xl\/worksheets\/.*\.xml$/i.test(k));
  if(!sheetName) throw new Error('لم يتم العثور على ورقة عمل داخل الملف — تأكد أن الملف بصيغة xlsx صحيحة');
  const sheetXml = decoder.decode(entries[sheetName]);
  return parseSheetXmlToRows(sheetXml, sharedStrings);
}
function parseSharedStrings(xml){
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  return Array.from(doc.getElementsByTagName('si')).map(si=> Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join(''));
}
function colLetterToIndex(ref){
  const m = (ref||'').match(/^([A-Z]+)/);
  if(!m) return 0;
  let n=0; for(const ch of m[1]){ n = n*26 + (ch.charCodeAt(0)-64); }
  return n-1;
}
function parseSheetXmlToRows(xml, sharedStrings){
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const rowNodes = Array.from(doc.getElementsByTagName('row'));
  const grid = rowNodes.map(rowNode=>{
    const rowArr = [];
    Array.from(rowNode.getElementsByTagName('c')).forEach(c=>{
      const idx = colLetterToIndex(c.getAttribute('r'));
      const type = c.getAttribute('t');
      const vNode = c.getElementsByTagName('v')[0];
      let value = '';
      if(type==='s'){
        const sIdx = vNode ? parseInt(vNode.textContent,10) : -1;
        value = sharedStrings[sIdx]!==undefined ? sharedStrings[sIdx] : '';
      } else if(type==='inlineStr'){
        const isNode = c.getElementsByTagName('is')[0];
        value = isNode ? isNode.textContent : '';
      } else {
        value = vNode ? vNode.textContent : '';
      }
      rowArr[idx] = value;
    });
    return rowArr;
  });
  if(!grid.length) return [];
  const header = grid[0].map(h=> (h==null?'':String(h)).trim());
  return grid.slice(1).map(rowArr=>{
    const obj={};
    header.forEach((h,i)=>{ obj[h] = (rowArr[i]!==undefined && rowArr[i]!==null) ? rowArr[i] : ''; });
    return obj;
  });
}
/* ---- فك أرشيف ZIP (تنسيق ملف xlsx) — يدعم التخزين بدون ضغط (0) وDEFLATE (8) ---- */
async function unzipEntries(bytes){
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocdOffset = -1;
  const searchFrom = Math.max(0, bytes.length-22-65557);
  for(let i=bytes.length-22; i>=searchFrom; i--){
    if(view.getUint32(i, true) === 0x06054b50){ eocdOffset = i; break; }
  }
  if(eocdOffset===-1) throw new Error('ملف Excel غير صالح (ليس بصيغة xlsx سليمة)');
  const entryCount = view.getUint16(eocdOffset+10, true);
  let cdOffset = view.getUint32(eocdOffset+16, true);
  const entries = {};
  const nameDecoder = new TextDecoder('utf-8');
  for(let i=0;i<entryCount;i++){
    if(view.getUint32(cdOffset, true) !== 0x02014b50) break;
    const method = view.getUint16(cdOffset+10, true);
    const compSize = view.getUint32(cdOffset+20, true);
    const nameLen = view.getUint16(cdOffset+28, true);
    const extraLen = view.getUint16(cdOffset+30, true);
    const commentLen = view.getUint16(cdOffset+32, true);
    const localHeaderOffset = view.getUint32(cdOffset+42, true);
    const name = nameDecoder.decode(bytes.subarray(cdOffset+46, cdOffset+46+nameLen));
    const needed = !name.endsWith('/') && /sharedStrings\.xml$|worksheets\/.*\.xml$/i.test(name);
    if(needed){
      const lfNameLen = view.getUint16(localHeaderOffset+26, true);
      const lfExtraLen = view.getUint16(localHeaderOffset+28, true);
      const dataStart = localHeaderOffset+30+lfNameLen+lfExtraLen;
      const compData = bytes.subarray(dataStart, dataStart+compSize);
      if(method===0){ entries[name] = compData; }
      else if(method===8){ entries[name] = await inflateRaw(compData); }
    }
    cdOffset += 46+nameLen+extraLen+commentLen;
  }
  return entries;
}
async function inflateRaw(compressed){
  if(typeof DecompressionStream === 'undefined'){
    throw new Error('هذا المتصفح لا يدعم فك ضغط ملفات Excel — استخدم متصفحًا حديثًا (Chrome/Edge/Firefox) أو ارفع الملف بصيغة CSV بدلاً من ذلك.');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([compressed]).stream().pipeThrough(ds);
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

/* ==========================================================================
   قارئ ملفات .xls القديمة (Excel 97-2003) — تنسيق BIFF8 داخل حاوية
   OLE Compound File Binary. مكتوب بالكامل بأدوات المتصفح الأساسية (DataView)
   بدون أي مكتبة خارجية أو اتصال شبكة، تمامًا كقارئ xlsx أعلاه. يدعم: جدول
   السلاسل النصية المشتركة (SST) مع امتداده عبر سجلات CONTINUE، الخلايا
   الرقمية (NUMBER/RK/MULRK)، النصية (LABELSST/LABEL)، الفارغة (BLANK)،
   والصيغ ذات النتيجة المخزَّنة (FORMULA+STRING). يقرأ ورقة العمل الأولى فقط
   (مطابقةً لسلوك قارئ xlsx أعلاه).
   ========================================================================== */
async function parseXlsFile(file){
  const bytes = new Uint8Array(await file.arrayBuffer());
  const streams = parseOleCfb(bytes);
  const wb = streams.find(e=>/^(Workbook|Book)$/i.test(e.name));
  if(!wb) throw new Error('لم يتم العثور على بيانات المصنّف داخل ملف xls — تأكد أنه ملف Excel 97-2003 صالح');
  return parseBiff8ToRows(wb.data);
}
function __xlsConcatU8(chunks, exactSize){
  const total = exactSize!=null && exactSize>=0 ? exactSize : chunks.reduce((s,c)=>s+c.length,0);
  const out = new Uint8Array(total);
  let off=0;
  for(const c of chunks){ const len = Math.min(c.length, total-off); out.set(c.subarray(0,len), off); off+=len; if(off>=total) break; }
  return out;
}
/* محلل بسيط لحاوية OLE CFB (FAT + Mini-FAT) — يكفي لاستخراج تيار Workbook/Book */
function parseOleCfb(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const sig = [0xD0,0xCF,0x11,0xE0,0xA1,0xB1,0x1A,0xE1];
  for(let i=0;i<8;i++){ if(bytes[i]!==sig[i]) throw new Error('الملف ليس بصيغة xls (OLE) صحيحة'); }
  const sectorShift = dv.getUint16(30, true);
  const sectorSize = 1<<sectorShift;
  const miniSectorShift = dv.getUint16(32, true);
  const miniSectorSize = 1<<miniSectorShift;
  const dirStart = dv.getUint32(48, true);
  const miniCutoff = dv.getUint32(56, true);
  const miniFatStart = dv.getUint32(60, true);
  const numMiniFatSectors = dv.getUint32(64, true);
  const difStart = dv.getUint32(68, true);
  const numDifSectors = dv.getUint32(72, true);

  const fatSectors = [];
  for(let i=0;i<109;i++){ const v = dv.getUint32(76+i*4, true); if(v!==0xFFFFFFFF) fatSectors.push(v); }
  let difSector = difStart;
  for(let i=0;i<numDifSectors;i++){
    const off = 512 + difSector*sectorSize;
    for(let j=0;j<sectorSize/4-1;j++){ const v = dv.getUint32(off+j*4, true); if(v!==0xFFFFFFFF) fatSectors.push(v); }
    difSector = dv.getUint32(off+sectorSize-4, true);
    if(difSector===0xFFFFFFFE || difSector===0xFFFFFFFF) break;
  }
  const fatEntriesPerSector = sectorSize/4;
  const fat = new Int32Array(fatSectors.length*fatEntriesPerSector);
  fatSectors.forEach((secId, idx)=>{
    const off = 512 + secId*sectorSize;
    for(let j=0;j<fatEntriesPerSector;j++){ fat[idx*fatEntriesPerSector+j] = dv.getInt32(off+j*4, true); }
  });
  function readChain(startSector, size, useMini, miniData, miniFat){
    const chunks = []; let sector = startSector; let remaining = size;
    const fatTable = useMini ? miniFat : fat;
    const secSize = useMini ? miniSectorSize : sectorSize;
    const source = useMini ? miniData : bytes;
    const baseOff = useMini ? 0 : 512;
    let guard = 0;
    while(sector!==-2 && sector>=0 && guard<1000000){
      const off = baseOff + sector*secSize;
      chunks.push(source.subarray(off, off+secSize));
      remaining -= secSize;
      sector = fatTable[sector];
      guard++;
    }
    return __xlsConcatU8(chunks, size!=null && size>=0 ? size : undefined);
  }
  const dirBytes = readChain(dirStart, -1, false);
  const entries = [];
  for(let off=0; off+128<=dirBytes.length; off+=128){
    const edv = new DataView(dirBytes.buffer, dirBytes.byteOffset+off, 128);
    const nameLen = edv.getUint16(64, true);
    if(nameLen<2) continue;
    let name = '';
    for(let i=0;i<nameLen-2;i+=2){ name += String.fromCharCode(dirBytes[off+i] | (dirBytes[off+i+1]<<8)); }
    const type = dirBytes[off+66];
    const startSec = edv.getUint32(116, true);
    const size = edv.getUint32(120, true);
    if(type===2 || type===5){ entries.push({name, type, startSec, size}); }
  }
  const root = entries.find(e=>e.type===5);
  let miniData = new Uint8Array(0), miniFat = new Int32Array(0);
  if(root && numMiniFatSectors>0){
    miniData = readChain(root.startSec, root.size, false);
    const miniFatBytes = readChain(miniFatStart, -1, false);
    miniFat = new Int32Array(Math.floor(miniFatBytes.length/4));
    const mv = new DataView(miniFatBytes.buffer, miniFatBytes.byteOffset, miniFatBytes.byteLength);
    for(let i=0;i<miniFat.length;i++) miniFat[i]=mv.getInt32(i*4, true);
  }
  return entries.filter(e=>e.type===2).map(e=>{
    const useMini = e.size < miniCutoff;
    const data = readChain(e.startSec, e.size, useMini, miniData, miniFat);
    return {name:e.name, data};
  });
}
/* قراءة جدول السلاسل النصية المشتركة (SST) عبر مقاطعها (السجل الأصلي + سجلات CONTINUE التالية له) */
function __xlsReadSstStrings(segments, uniqueCount){
  let segIdx=0, pos=0;
  function atEnd(){ return segIdx>=segments.length; }
  function skipEmpty(){ while(!atEnd() && pos>=segments[segIdx].length){ segIdx++; pos=0; } }
  function readU8(){ skipEmpty(); if(atEnd()) return 0; const b=segments[segIdx][pos]; pos++; return b; }
  function readU16(){ const lo=readU8(); const hi=readU8(); return lo|(hi<<8); }
  function readU32(){ const lo=readU16(); const hi=readU16(); return (lo|(hi<<16))>>>0; }
  function readChars(remaining, highByteInit){
    let out=''; let highByte = highByteInit;
    while(remaining>0){
      skipEmpty();
      if(atEnd()) break;
      if(highByte){
        const lo = segments[segIdx][pos]; pos++;
        skipEmpty();
        let hi = 0;
        if(!atEnd() && pos<segments[segIdx].length){ hi = segments[segIdx][pos]; pos++; }
        out += String.fromCharCode(lo | (hi<<8));
      } else {
        out += String.fromCharCode(segments[segIdx][pos]); pos++;
      }
      remaining--;
      // عبور حد سجل CONTINUE أثناء قراءة أحرف سلسلة واحدة يتطلب بايت أعلام جديدًا قبل المتابعة
      if(remaining>0){
        while(!atEnd() && pos>=segments[segIdx].length){
          segIdx++; pos=0;
          if(!atEnd() && segments[segIdx].length>0){ const nf=segments[segIdx][pos]; pos++; highByte = nf & 0x1; }
        }
      }
    }
    return out;
  }
  const strings=[];
  for(let i=0;i<uniqueCount;i++){
    const cch = readU16();
    const flags = readU8();
    const fHighByte = flags & 0x1;
    const fExtSt = flags & 0x4;
    const fRichSt = flags & 0x8;
    let cRun=0, cbExtRst=0;
    if(fRichSt) cRun = readU16();
    if(fExtSt) cbExtRst = readU32();
    const text = readChars(cch, !!fHighByte);
    if(fRichSt){ for(let k=0;k<cRun;k++) readU32(); }
    if(fExtSt){ for(let k=0;k<cbExtRst;k++) readU8(); }
    strings.push(text);
  }
  return strings;
}
function __xlsDecodeRk(rk){
  const fX100 = rk & 0x1;
  const fInt = rk & 0x2;
  let value;
  if(fInt){ value = rk >> 2; }
  else{
    const buf = new ArrayBuffer(8); const dv2 = new DataView(buf);
    dv2.setInt32(0, 0, true);
    dv2.setInt32(4, rk & 0xFFFFFFFC, true);
    value = dv2.getFloat64(0, true);
  }
  if(fX100) value = value/100;
  return value;
}
function __xlsSetCell(grid, r, c, v){ if(!grid[r]) grid[r]=[]; grid[r][c]=v; }
function __xlsInlineUnicodeString(body, cchOffset, flagsOffset){
  const bd = new DataView(body.buffer, body.byteOffset, body.byteLength);
  const cch = bd.getUint16(cchOffset, true);
  const flags = body[flagsOffset];
  const highByte = flags & 0x1;
  let str=''; let p = flagsOffset+1;
  for(let k=0;k<cch && p<body.length;k++){
    if(highByte){ if(p+1<body.length){ str += String.fromCharCode(body[p] | (body[p+1]<<8)); } p+=2; }
    else { str += String.fromCharCode(body[p]); p+=1; }
  }
  return str;
}
function __xlsPeekRecord(dv, pos, data){
  if(pos+4>data.length) return null;
  const id = dv.getUint16(pos, true);
  const len = dv.getUint16(pos+2, true);
  if(pos+4+len>data.length) return null;
  return {id, body:data.subarray(pos+4,pos+4+len), nextPos:pos+4+len};
}
/* مسح تسلسلي لسجلات BIFF8 داخل تيار Workbook — يجمع SST من قسم الإعدادات العامة
   ثم خلايا ورقة العمل الأولى فقط (BOF بنوع 0x0010) ويتوقف عند EOF الخاص بها */
function parseBiff8ToRows(data){
  const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
  let pos = 0;
  let sst = [];
  let sheetGrid = [];
  let inSheet = false, sheetDone = false;
  while(pos + 4 <= data.length && !sheetDone){
    const id = dv.getUint16(pos, true);
    const len = dv.getUint16(pos+2, true);
    const bodyStart = pos+4;
    if(bodyStart+len > data.length) break;
    const body = data.subarray(bodyStart, bodyStart+len);

    if(id===0x00FC){ // SST
      let p2 = bodyStart+len;
      const segments = [body.subarray(8)];
      while(p2+4<=data.length){
        const nid = dv.getUint16(p2, true);
        const nlen = dv.getUint16(p2+2, true);
        if(nid!==0x003C) break;
        if(p2+4+nlen>data.length) break;
        segments.push(data.subarray(p2+4, p2+4+nlen));
        p2 += 4+nlen;
      }
      const bodyDv = new DataView(body.buffer, body.byteOffset, body.byteLength);
      const uniqueCount = bodyDv.getUint32(4, true);
      sst = __xlsReadSstStrings(segments, uniqueCount);
      pos = p2; continue;
    }
    if(id===0x0809){ // BOF
      const dt = body.length>=4 ? new DataView(body.buffer,body.byteOffset,body.byteLength).getUint16(2, true) : 0;
      if(dt===0x0010 && !sheetDone && !inSheet){ inSheet = true; }
    } else if(id===0x000A){ // EOF
      if(inSheet){ sheetDone = true; }
    } else if(inSheet){
      const bd = body.length>=6 ? new DataView(body.buffer,body.byteOffset,body.byteLength) : null;
      if(id===0x0203 && bd){ // NUMBER
        const r=bd.getUint16(0,true), c=bd.getUint16(2,true), v=bd.getFloat64(6,true);
        __xlsSetCell(sheetGrid, r, c, v);
      } else if(id===0x027E && bd){ // RK
        const r=bd.getUint16(0,true), c=bd.getUint16(2,true), rk=bd.getInt32(6,true);
        __xlsSetCell(sheetGrid, r, c, __xlsDecodeRk(rk));
      } else if(id===0x00BD && bd){ // MULRK
        const r=bd.getUint16(0,true), c0=bd.getUint16(2,true);
        let off=4, col=c0;
        while(off+6<=body.length-2){
          const rk = bd.getInt32(off+2, true);
          __xlsSetCell(sheetGrid, r, col, __xlsDecodeRk(rk));
          col++; off+=6;
        }
      } else if(id===0x00FD && bd){ // LABELSST
        const r=bd.getUint16(0,true), c=bd.getUint16(2,true), isst=bd.getUint32(6,true);
        __xlsSetCell(sheetGrid, r, c, sst[isst]!==undefined?sst[isst]:'');
      } else if(id===0x0204 && bd){ // LABEL
        const r=bd.getUint16(0,true), c=bd.getUint16(2,true);
        __xlsSetCell(sheetGrid, r, c, __xlsInlineUnicodeString(body, 6, 8));
      } else if(id===0x0201 && bd){ // BLANK
        const r=bd.getUint16(0,true), c=bd.getUint16(2,true);
        __xlsSetCell(sheetGrid, r, c, '');
      } else if(id===0x0006 && bd && body.length>=14){ // FORMULA (نتيجة مخزَّنة فقط، دون تقييم الصيغة)
        const r=bd.getUint16(0,true), c=bd.getUint16(2,true);
        const marker=bd.getUint16(6,true);
        if(marker===0xFFFF){
          const kind = body[12];
          if(kind===0){
            const next = __xlsPeekRecord(dv, bodyStart+len, data);
            if(next && next.id===0x0207){
              __xlsSetCell(sheetGrid, r, c, __xlsInlineUnicodeString(next.body, 0, 2));
              pos = next.nextPos; continue;
            }
            __xlsSetCell(sheetGrid, r, c, '');
          } else if(kind===1){ __xlsSetCell(sheetGrid, r, c, body[6]?true:false); }
          else { __xlsSetCell(sheetGrid, r, c, ''); }
        } else {
          __xlsSetCell(sheetGrid, r, c, bd.getFloat64(6,true));
        }
      }
    }
    pos = bodyStart+len;
  }
  const rows = sheetGrid.filter(Boolean);
  if(!rows.length) return [];
  const header = (rows[0]||[]).map(h=> (h==null?'':String(h)).trim());
  return rows.slice(1).map(rowArr=>{
    const obj={};
    header.forEach((h,i)=>{ const v=(rowArr||[])[i]; obj[h] = (v!==undefined && v!==null) ? String(v) : ''; });
    return obj;
  });
}

function findColumnKey(sampleRow, candidates){
  const keys = Object.keys(sampleRow||{});
  const norm = s => String(s).replace(/[\sً-ْ]/g,'').trim();
  for(const cand of candidates){
    const hit = keys.find(k => norm(k).includes(norm(cand)));
    if(hit) return hit;
  }
  return null;
}

/* ==================== أمان: تجزئة كلمات المرور محليًا ====================
   التجزئة الحالية: PBKDF2-SHA256 بعدد تكرارات كبير (بطيئة عمدًا لمقاومة تخمين
   كلمات المرور دون اتصال، لو تسرّبت نسخة احتياطية أو قاعدة IndexedDB). الحسابات
   القديمة (قبل هذا التحديث) كانت مجزَّأة بجولة SHA-256 واحدة فقط ("legacy") —
   أضعف بكثير أمام هجمات القوة الغاشمة. للحفاظ على قدرة هذه الحسابات على الدخول
   دون إجبار كل المستخدمين على إعادة تعيين كلمة مرورهم يدويًا، verifyStaffLogin/
   verifyStudentLogin يتحققان بالخوارزمية المسجَّلة فعليًا على كل حساب (حقل
   hashAlgo/authAlgo)، ثم يُرقّيان الحساب تلقائيًا وبصمت إلى PBKDF2 بمجرد نجاح
   أول دخول صحيح — تمامًا كما تفعل الأنظمة المرجعية الحديثة. */
const PBKDF2_ITERATIONS = 150000;
function genSalt(){ const a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function hexToBytes(hex){ const a=new Uint8Array(hex.length/2); for(let i=0;i<a.length;i++) a[i]=parseInt(hex.substr(i*2,2),16); return a; }
function bytesToHex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
// الخوارزمية القديمة (جولة SHA-256 واحدة) — للتحقق من الحسابات القديمة فقط، لا تُستخدم لإنشاء حسابات جديدة أبدًا.
async function hashPasswordLegacy(pw, salt){
  const data = new TextEncoder().encode(salt+':'+pw);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return bytesToHex(buf);
}
// الخوارزمية الحالية لكل كلمة مرور جديدة أو مُعاد تعيينها.
async function hashPasswordPBKDF2(pw, saltHex, iterations){
  iterations = iterations || PBKDF2_ITERATIONS;
  const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:hexToBytes(saltHex), iterations, hash:'SHA-256'}, keyMaterial, 256);
  return bytesToHex(bits);
}
// نقطة الإنشاء الوحيدة لأي كلمة مرور جديدة في النظام — تُرجع {salt, hash, hashAlgo, hashIter} جاهزة للتخزين.
async function makeNewPasswordRecord(pw){
  const salt = genSalt();
  const hash = await hashPasswordPBKDF2(pw, salt, PBKDF2_ITERATIONS);
  return {salt, hash, hashAlgo:'pbkdf2', hashIter:PBKDF2_ITERATIONS};
}
// يتحقق من كلمة مرور مقابل سجل مخزَّن (salt/hash/hashAlgo/hashIter) بصرف النظر عن
// عمر الحساب أو خوارزميته، ويُرجع أيضًا ما إذا كان يلزم ترقية الحساب صامتًا.
async function verifyPasswordRecord(pw, record){
  const algo = record.hashAlgo || 'legacy';
  const computed = algo==='pbkdf2'
    ? await hashPasswordPBKDF2(pw, record.salt, record.hashIter||PBKDF2_ITERATIONS)
    : await hashPasswordLegacy(pw, record.salt);
  const ok = computed===record.hash;
  return {ok, needsUpgrade: ok && algo!=='pbkdf2'};
}
function validatePasswordStrength(pw){
  if(!pw || pw.length<6) return {ok:false, msg:'كلمة المرور يجب ألا تقل عن 6 أحرف'};
  return {ok:true};
}
function genTempPassword(){
  const a=new Uint8Array(4); crypto.getRandomValues(a);
  return Array.from(a).map(b=>(b%10)).join('') + Array.from(a).map(b=>String.fromCharCode(65+(b%26))).slice(0,2).join('');
}

/* ==================== طبقة قاعدة البيانات (IndexedDB) ====================
   ملاحظة: أي إضافة لمخزن بيانات (object store) جديد يجب أن تُرفق دائمًا برفع
   DB_VERSION رقمًا واحدًا — المتصفح لا يُعيد تشغيل onupgradeneeded إلا عند طلب
   رقم إصدار أعلى من المخزَّن فعليًا لديه؛ وإلا يفتح القاعدة القديمة كما هي دون
   المخازن الجديدة، فيفشل أول تعامل معها بخطأ "object store was not found". */
let db=null, currentUser=null, currentView='dashboard', viewParams={};
/* ملحوظة صيانة مهمة: أي إضافة لمخزن بيانات (object store) جديد يجب أن تُرفق
   دائمًا برفع DB_VERSION رقمًا واحدًا، وإلا فلن يعمل onupgradeneeded لمن فتح
   نسخة أقدم من الملف مسبقًا (راجع سجل التغييرات في ملاحظات المشروع). */
const DB_NAME='zalingei_registration_db', DB_VERSION=4;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('students')){
        const s = d.createObjectStore('students', {keyPath:'id'});
        s.createIndex('college','college',{unique:false});
        s.createIndex('departmentId','departmentId',{unique:false});
      }
      if(!d.objectStoreNames.contains('departments')){
        const s = d.createObjectStore('departments', {keyPath:'id'});
        s.createIndex('college','college',{unique:false});
      }
      if(!d.objectStoreNames.contains('courses')){
        const s = d.createObjectStore('courses', {keyPath:'id'});
        s.createIndex('college','college',{unique:false});
      }
      if(!d.objectStoreNames.contains('semesters')){
        d.createObjectStore('semesters', {keyPath:'id'});
      }
      if(!d.objectStoreNames.contains('offerings')){
        const s = d.createObjectStore('offerings', {keyPath:'id'});
        s.createIndex('semesterId','semesterId',{unique:false});
        s.createIndex('courseId','courseId',{unique:false});
      }
      if(!d.objectStoreNames.contains('registrations')){
        const s = d.createObjectStore('registrations', {keyPath:'id'});
        s.createIndex('studentId','studentId',{unique:false});
        s.createIndex('offeringId','offeringId',{unique:false});
        s.createIndex('semesterId','semesterId',{unique:false});
        s.createIndex('requestId','requestId',{unique:false});
      }
      if(!d.objectStoreNames.contains('registrationRequests')){
        const s = d.createObjectStore('registrationRequests', {keyPath:'id'});
        s.createIndex('studentId','studentId',{unique:false});
        s.createIndex('semesterId','semesterId',{unique:false});
        s.createIndex('status','status',{unique:false});
      }
      if(!d.objectStoreNames.contains('academicClearance')){
        d.createObjectStore('academicClearance', {keyPath:'id'});
      }
      if(!d.objectStoreNames.contains('curricula')){
        const s = d.createObjectStore('curricula', {keyPath:'id'});
        s.createIndex('departmentId','departmentId',{unique:false});
      }
      if(!d.objectStoreNames.contains('users')){
        d.createObjectStore('users', {keyPath:'username'});
      }
      if(!d.objectStoreNames.contains('logs')){
        d.createObjectStore('logs', {keyPath:'id'});
      }
      if(!d.objectStoreNames.contains('settings')){
        d.createObjectStore('settings', {keyPath:'key'});
      }
    };
    req.onsuccess = ()=>{ db=req.result; resolve(db); };
    req.onerror = (e)=> reject(e.target.error);
    req.onblocked = ()=> reject(new Error('يوجد تبويب آخر مفتوح لهذا النظام يمنع تحديث قاعدة البيانات — أغلق كل تبويبات النظام الأخرى ثم أعد تحميل الصفحة.'));
  });
}
function dbGet(store, key){ return new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).get(key); r.onsuccess=()=>res(r.result||null); r.onerror=e=>rej(e.target.error); }); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=e=>rej(e.target.error); }); }
function dbGetAllByIndex(store, index, value){ return new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).index(index).getAll(value); r.onsuccess=()=>res(r.result||[]); r.onerror=e=>rej(e.target.error); }); }
/* dbPut/dbDelete هما نقطتا الكتابة الوحيدتان في كامل النظام — لذلك يكفي ربط
   طابور المزامنة السحابية (queueSync/queueDelete) هنا مرة واحدة بدل تعديل عشرات
   نقاط النداء. dbPutRaw نسخة "صامتة" لا تُشغّل المزامنة، تُستخدم فقط عند كتابة
   بيانات قادمة أصلًا من السحابة (تفاديًا لرفعها إلى نفسها من جديد). */
function dbPutRaw(store, val){ return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val); tx.oncomplete=()=>res(val); tx.onerror=e=>rej(e.target.error); }); }
function dbPut(store, val){ return dbPutRaw(store, val).then(v=>{ if(SYNCED_TABLES.includes(store)) queueSync(store, v); return v; }); }
function dbDelete(store, key){
  return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=()=>{ if(SYNCED_TABLES.includes(store)) queueDelete(store, key); res(true); }; tx.onerror=e=>rej(e.target.error); });
}
function dbCount(store){ return new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).count(); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e.target.error); }); }

/* ==================== إعدادات محلية (key/value) ==================== */
function getSetting(key){ return dbGet('settings', key).then(r=> r? r.value : null); }
function setSetting(key, value){ return dbPutRaw('settings', {key, value}); }

async function addLog(action, details){
  const who = currentUser ? (currentUser.type==='staff'? currentUser.username : (currentUser.id+' (طالب)')) : '—';

/* ==================== المصادقة: الموظفون ==================== */
async function createStaffAccount(username, password, role, college, extra){
  extra = extra||{};
  const rec = await makeNewPasswordRecord(password);
  await dbPut('users', {
    username, salt:rec.salt, hash:rec.hash, hashAlgo:rec.hashAlgo, hashIter:rec.hashIter,
    role, college: role==='admin' ? null : (college||null),
    fullName: extra.fullName||null, jobTitle: extra.jobTitle||null, phone: extra.phone||null,
    active:true, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
  });
  ensureCloudAuthAccount(emailForUsername(username), password); // best-effort، لا يُنتظَر ولا يُعطِّل الواجهة
}
async function verifyStaffLogin(username, password){
  const user = await dbGet('users', username);
  if(!user || user.active===false || !user.hash) return null;
  const {ok, needsUpgrade} = await verifyPasswordRecord(password, user);
  if(!ok) return null;
  if(needsUpgrade){
    // ترقية صامتة لخوارزمية أقوى بمجرد أول دخول ناجح بحساب قديم — المستخدم لا يلاحظ شيئًا.
    const rec = await makeNewPasswordRecord(password);
    user.salt=rec.salt; user.hash=rec.hash; user.hashAlgo=rec.hashAlgo; user.hashIter=rec.hashIter; user.updatedAt=new Date().toISOString();
    await dbPut('users', user);
  }
  return user;
}
/* ==================== المصادقة: الطلاب (كلمة المرور مخزنة على سجل الطالب) ====================
   isTemp=true يُستخدم عند توليد كلمة مرور مؤقتة (تسجيل جديد أو إعادة تعيين من
   موظف) فيُعلَّم الحساب بـmustChangePassword ليُجبَر الطالب على تغييرها فور أول
   دخول (انظر enforceStudentPasswordChange). عندما يغيّر الطالب كلمة مروره بنفسه
   (isTemp=false) يُرفَع هذا العلَم تلقائيًا. */
async function setStudentPassword(studentId, password, isTemp){
  const student = await dbGet('students', studentId);
  if(!student) throw new Error('طالب غير موجود');
  const rec = await makeNewPasswordRecord(password);
  student.authSalt = rec.salt; student.authHash = rec.hash; student.authAlgo = rec.hashAlgo; student.authIter = rec.hashIter;
  student.mustChangePassword = !!isTemp;
  student.updatedAt = new Date().toISOString();
  await dbPut('students', student);
  ensureCloudAuthAccount(emailForStudentId(studentId), password); // best-effort، لا يُنتظَر ولا يُعطِّل الواجهة
}
async function verifyStudentLogin(studentId, password){
  const student = await dbGet('students', studentId);
  if(!student || student.deleted || !student.authHash) return null;
  const {ok, needsUpgrade} = await verifyPasswordRecord(password, {salt:student.authSalt, hash:student.authHash, hashAlgo:student.authAlgo, hashIter:student.authIter});
  if(!ok) return null;
  if(needsUpgrade){
    const rec = await makeNewPasswordRecord(password);
    student.authSalt=rec.salt; student.authHash=rec.hash; student.authAlgo=rec.hashAlgo; student.authIter=rec.hashIter; student.updatedAt=new Date().toISOString();
    await dbPut('students', student);
  }
  return student;
}

/* ==================== توليد رقم التسجيل (رقم القيد) ====================
   الصيغة: تسلسل-رمزالقسم-سنةالقبول (مثال: 2-ن-22)
   التسلسل يبدأ من 1 ويُعاد لكل قسم مع كل سنة قبول جديدة، لكن الرقم الكامل
   المكوَّن من الثلاثة أجزاء معًا لا يتكرر أبدًا عبر كامل تاريخ النظام. */
async function generateRegNo(departmentId, admissionYear){
  const dept = await dbGet('departments', departmentId);
  if(!dept) throw new Error('القسم/التخصص غير موجود');
  const yy = String(admissionYear).slice(-2);
  const allStudents = await dbGetAll('students'); // بما فيهم المحذوفون: الرقم لا يُعاد استخدامه أبدًا
  const usedRegNos = new Set(allStudents.map(s=>s.regNo).filter(Boolean));
  let seq = allStudents.filter(s=> s.departmentId===departmentId && String(s.batch)===String(admissionYear)).length + 1;
  let candidate = `${seq}-${dept.code}-${yy}`;
  while(usedRegNos.has(candidate)){ seq++; candidate = `${seq}-${dept.code}-${yy}`; }
  return candidate;
}

/* ==================== إنشاء سجل طالب من كشف قبول الوزارة ==================== */
async function createStudentFromAdmission(data){
  const { studentId, name, secondarySchool, college, departmentId, year, phone, gender, specialization, notes } = data;
  if(!studentId) throw new Error('الرجاء إدخال الرقم الجامعي');
  if(!name) throw new Error('الرجاء إدخال اسم الطالب');
  if(!college) throw new Error('الرجاء اختيار الكلية');
  if(!departmentId) throw new Error('الرجاء اختيار القسم/التخصص');
  const allStudents = await dbGetAll('students'); // بما فيهم المحذوفون: الرقم الجامعي لا يُعاد استخدامه
  if(allStudents.some(s=>s.id===studentId)) throw new Error(`الرقم الجامعي "${studentId}" مستخدم مسبقًا`);
  const dept = await dbGet('departments', departmentId);
  const regNo = await generateRegNo(departmentId, year);
  const tempPw = genTempPassword();
  const row = {
    id: studentId, name, college, departmentId, department: dept?dept.name:null,
    specialization: (specialization&&specialization.trim()) ? specialization.trim() : (dept?dept.name:null),
    secondarySchool: secondarySchool||null, regNo, gender: gender||null, batch:String(year), phone: phone||null, email:null,
    notes: notes||null,
    status:'active', isGraduate:false, completedCourses:[],
    currentLevel:1, blockFlags:[], levelAdvancedForSemesters:[],
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), deleted:false,
  };
  await dbPut('students', row);
  await setStudentPassword(studentId, tempPw, true);
  return {row, tempPw};
}

/* ==================== عوائق التسجيل المستقلة (غش / عائق مالي / ملحق) ====================
   تُدار كعلامات (flags) على سجل الطالب نفسه، منفصلة عن استيراد نتيجة الفصل،
   وتبقى فعّالة (تمنع التسجيل) حتى يرفعها موظف مخوَّل صراحةً عبر "فك تجميد". */
async function addStudentFlag(studentId, type, note, semesterId){
  const student = await dbGet('students', studentId);
  if(!student) throw new Error('طالب غير موجود');
  const flags = student.blockFlags || [];
  flags.push({id:uid(), type, note: note||null, semesterId: semesterId||null,
    setAt:new Date().toISOString(), setBy: currentUser.username, liftedAt:null, liftedBy:null, liftNote:null});
  student.blockFlags = flags; student.updatedAt = new Date().toISOString();
  await dbPut('students', student);
  await addLog('تجميد تسجيل طالب', `${studentId} — ${(FLAG_TYPES[type]||{}).label||type}${note?': '+note:''}`);
}
async function liftStudentFlag(studentId, flagId, note){
  const student = await dbGet('students', studentId);
  if(!student) throw new Error('طالب غير موجود');
  const flags = student.blockFlags || [];
  const f = flags.find(x=>x.id===flagId);
  if(!f) throw new Error('عائق غير موجود');
  f.liftedAt = new Date().toISOString(); f.liftedBy = currentUser.username; f.liftNote = note||null;
  student.blockFlags = flags; student.updatedAt = new Date().toISOString();
  await dbPut('students', student);
  await addLog('فك تجميد تسجيل طالب', `${studentId} — ${(FLAG_TYPES[f.type]||{}).label||f.type}`);
}

/* ==================== المزامنة السحابية مع Supabase (اختيارية بالكامل) ====================
   النظام يعمل محليًا أولًا (Offline-first) عبر IndexedDB دائمًا — لا شيء هنا
   إلزامي. إن أدخل المسؤول رابط مشروع Supabase ومفتاح anon من صفحة "الإعدادات"،
   تُزامَن كل عملية إضافة/تعديل/حذف تلقائيًا في الخلفية (queueSync)، ويحصل
   الموظفون والطلاب على جلسة مصادقة حقيقية عبر Supabase Auth عند تسجيل الدخول
   وهم متصلون بالإنترنت (بريد اصطناعي: username@staff.zalingei.local للموظفين،
   ورقمجامعي@students.zalingei.local للطلاب) — بحيث تشترط سياسات RLS في قاعدة
   البيانات جلسة دخول حقيقية، لا مجرد امتلاك رابط المشروع ومفتاح anon العلني.
   عند انعدام الاتصال يستمر العمل محليًا دون أي توقف، وتُستكمل المزامنة تلقائيًا
   عند عودة الاتصال (أو يدويًا بزرَّي "مزامنة الآن" و"سحب من السحابة"). */

function withTimeout(promise, ms, tag){
  return Promise.race([promise, new Promise((_,rej)=> setTimeout(()=>rej(new Error(tag||'TIMEOUT')), ms))]);
}
function emailForUsername(username){ return String(username||'').trim().toLowerCase()+'@staff.zalingei.local'; }
function emailForStudentId(id){ return String(id||'').trim().toLowerCase()+'@students.zalingei.local'; }

let supabaseClient = null;
async function ensureSupabaseClient(){
  if(supabaseClient) return supabaseClient;
  const url = await getSetting('supabaseUrl');
  const key = await getSetting('supabaseAnonKey');
  if(!url || !key) return null;
  if(!window.supabase || !window.supabase.createClient) return null;
  try{ supabaseClient = window.supabase.createClient(url, key); }catch(e){ supabaseClient = null; }

}
// عميل "مؤقت" مستقل بجلسة غير محفوظة (persistSession:false) — يُستخدم فقط عند
// إنشاء حساب مصادقة جديد (signUp) حتى لا يزيح جلسة المستخدم الحالي المسجَّل
// دخوله فعليًا في هذا المتصفح (وإلا لأزعج كل عملية "إضافة طالب" جلسة الموظف).
function freshAuthClient(url, key){
  if(!window.supabase || !window.supabase.createClient) return null;
  try{ return window.supabase.createClient(url, key, {auth:{persistSession:false, autoRefreshToken:false}}); }catch(e){ return null; }
}
async function ensureCloudAuthAccount(email, password){
  try{
    const url = await getSetting('supabaseUrl'); const key = await getSetting('supabaseAnonKey');
    if(!url || !key || typeof navigator==='undefined' || !navigator.onLine) return;
    const client = freshAuthClient(url, key);
    if(!client) return;
    // best-effort ولا يحجب الواجهة؛ فشل هذا الاستدعاء (لا اتصال، أو الحساب موجود
    // مسبقًا كما يحدث عند إعادة تعيين كلمة مرور طالب) لا يؤثر إطلاقًا على العمل المحلي.
    await withTimeout(client.auth.signUp({email, password}), 10000, 'SUPABASE_TIMEOUT');
  }catch(e){ /* تجاهل — يبقى الحساب صالحًا محليًا بالكامل */ }
}

function __rowTimestamp(row){
  return new Date(row.updatedAt || row.createdAt || row.submittedAt || row.importedAt || 0).getTime();
}

let __sbQueue = {}, __sbFlushTimer = null;
function queueSync(table, row){
  if(!SYNCED_TABLES.includes(table)) return;
  if(!__sbQueue[table]) __sbQueue[table] = new Map();
  __sbQueue[table].set(__sbPk(table, row), row);
  if(__sbFlushTimer) return;
  __sbFlushTimer = setTimeout(async ()=>{ __sbFlushTimer=null; await __flushSyncQueue(); }, 1500);
}
const RECEIPTS_BUCKET = 'receipts';
async function ensureReceiptUploaded(client, request){
  if(!request.receiptFile || request.receiptStoragePath) return request;
  try{
    const path = `${request.studentId}/${request.id}-${request.receiptFileName||'receipt'}`.replace(/[?#\[\]]/g,'_');
    const { error } = await client.storage.from(RECEIPTS_BUCKET).upload(path, request.receiptFile, {contentType:request.receiptFile.type||'application/octet-stream', upsert:true});
    if(error) throw error;
    request.receiptStoragePath = path;
    await dbPutRaw('registrationRequests', request); // خزّن المسار محليًا دون إعادة تشغيل المزامنة فورًا
  }catch(e){ console.warn('تعذّر رفع ملف الإيصال إلى التخزين السحابي:', e); }
  return request;
}
async function __flushSyncQueue(){
  const client = await ensureSupabaseClient();
  if(!client) return; // غير مُهيَّأ بعد — البيانات آمنة محليًا وستُرفع لاحقًا عبر "مزامنة الآن"
  let processed=0, anyError=false;
  for(const table of Object.keys(__sbQueue)){
    const rows = Array.from(__sbQueue[table].values());
    if(!rows.length) continue;
    __sbQueue[table] = new Map();
    try{
      let sourceRows = rows;
      if(table==='registrationRequests'){ sourceRows = await Promise.all(rows.map(r=>ensureReceiptUploaded(client, r))); }
      const mapped = sourceRows.map(r=>__sbMap(table, r));
      const { error } = await client.from(sbTableName(table)).upsert(mapped);
      if(error){ console.warn('Supabase sync error:', table, error.message); anyError=true; }
      else processed += rows.length;
    }catch(e){ console.warn('Supabase sync failed:', table, e); anyError=true; }
  }
  if(processed>0 && !anyError){ await setSetting('lastSupabaseSyncAt', new Date().toISOString()); }
}
async function queueDelete(table, key){
  if(!SYNCED_TABLES.includes(table)) return;
  const client = await ensureSupabaseClient();
  if(!client) return;
  const col = table==='users' ? 'username' : 'id';
  try{ await client.from(sbTableName(table)).delete().eq(col, String(key)); }catch(e){ console.warn('Supabase delete failed:', table, key, e); }
}
async function silentPullMergeAll(){
  const client = await ensureSupabaseClient();
  if(!client) return {ok:false};
  for(const table of SYNCED_TABLES){
    try{
      const { data, error } = await client.from(sbTableName(table)).select('*');
      if(error || !data) continue;
      for(const row of data){
        const unmapped = __sbUnmap(table, row);
        const key = table==='users' ? unmapped.username : unmapped.id;
        const local = await dbGet(table, key);
        if(!local || __rowTimestamp(unmapped) >= __rowTimestamp(local)){
          // احتفظ بملف الإيصال المحلي (Blob) غير القابل للنقل عبر JSON إن كان موجودًا محليًا فقط
          if(table==='registrationRequests' && local && local.receiptFile && !unmapped.receiptFile) unmapped.receiptFile = local.receiptFile;
          await dbPutRaw(table, unmapped);
        }
      }
    }catch(e){ console.warn('Pull merge failed for', table, e); }
  }
  return {ok:true};
}
async function pushAllToSupabase(){
  const client = await ensureSupabaseClient();
  if(!client){ toast('أدخل رابط Supabase ومفتاح anon واحفظهما أولًا', true); return; }
  for(const table of SYNCED_TABLES){
    const rows = await dbGetAll(table);
    if(rows.length) rows.forEach(r=>queueSync(table, r));
  }
  if(__sbFlushTimer){ clearTimeout(__sbFlushTimer); __sbFlushTimer=null; }
  await __flushSyncQueue();
  await addLog('مزامنة كاملة إلى Supabase (رفع)');
  toast('تم رفع كل البيانات المحلية إلى السحابة'); navigate('settings');
}
async function pullAllFromSupabase(){
  const client = await ensureSupabaseClient();
  if(!client){ toast('أدخل رابط Supabase ومفتاح anon واحفظهما أولًا', true); return; }
  const res = await withTimeout(silentPullMergeAll(), 30000, 'SUPABASE_TIMEOUT').catch(()=>({ok:false}));
  if(!res.ok){ toast('تعذّرت المزامنة من السحابة — تحقق من الاتصال وإعدادات RLS', true); return; }
  await addLog('مزامنة كاملة من Supabase (سحب/دمج)');
  toast('تم سحب أحدث نسخة من السحابة ودمجها محليًا'); navigate('settings');
}

   حماية للأجهزة المشتركة (مثل مكاتب القبول والتسجيل): بعد فترة خمول طويلة
   دون أي تفاعل مع الصفحة، يُسجَّل خروج المستخدم تلقائيًا. المؤقت يُعاد ضبطه مع
   أي نقر/ضغط مفتاح/لمس/تمرير، ويعمل فقط أثناء وجود جلسة مفتوحة (currentUser). */
const INACTIVITY_TIMEOUT_MS = 20*60*1000; // 20 دقيقة خمول
let __inactivityTimer = null;
function resetInactivityTimer(){
  if(__inactivityTimer) clearTimeout(__inactivityTimer);
  if(!currentUser) return;
  __inactivityTimer = setTimeout(async ()=>{
    if(!currentUser) return;
    await doLogout();
    toast('تم تسجيل خروجك تلقائيًا لعدم النشاط لفترة طويلة، لحماية حسابك', true);
  }, INACTIVITY_TIMEOUT_MS);
}
['click','keydown','touchstart','scroll'].forEach(evt=>
  document.addEventListener(evt, ()=>{ if(currentUser) resetInactivityTimer(); }, {passive:true})
);

async function doLogout(){
  if(__inactivityTimer){ clearTimeout(__inactivityTimer); __inactivityTimer=null; }
  await addLog('تسجيل الخروج');
  if(supabaseClient){
    try{ if(__sbFlushTimer){ clearTimeout(__sbFlushTimer); __sbFlushTimer=null; } await withTimeout(__flushSyncQueue(), 8000, 'SYNC_TIMEOUT'); }catch(e){}
    try{ await supabaseClient.auth.signOut(); }catch(e){}
    supabaseClient = null;
  }
  currentUser=null;
  try{ sessionStorage.removeItem('zru_session'); }catch(e){}
  document.getElementById('shell').style.display='none';
  document.getElementById('authWrap').style.display='flex';
  await renderAuth();
}

  // يُعيد {ok:true} إن نجحت المصادقة الحقيقية عبر Supabase — لا يمنع أبدًا التحقق
  // المحلي كخطة بديلة (offline أو كلمة مرور مزامنتها السحابية لم تكتمل بعد).

/* ==================== جرس الإشعارات ==================== */
async function computeNotifItems(){
  const items = [];
  if(!currentUser) return items;
  if(currentUser.type==='staff'){
    const scope = myCollegeScope();
    if(perm('canManageAdmissions') || perm('canManageSemesters')){
      let pending = (await dbGetAll('registrationRequests')).filter(r=>r.status==='pending' && (!scope||r.college===scope));
      if(pending.length){
        items.push({id:`preg-pending-${pending.length}`, label:`${pending.length} طلب تسجيل بانتظار المراجعة المالية`, time:null, action:()=>navigate('registrations',{})});
      }
    }
    if(perm('canViewLogs')){
      const logs = (await dbGetAll('logs')).sort((a,b)=> new Date(b.ts)-new Date(a.ts)).slice(0,8);
      logs.forEach(l=> items.push({id:`log-${l.id}`, label:`${l.action}${l.details?' — '+l.details:''}`, time:fmtDateTime(l.ts), action:()=>navigate('logs')}));
    }
  } else {
    const student = await dbGet('students', currentUser.id);
    if(student){
      activeFlags(student).forEach(f=>{
        const t = FLAG_TYPES[f.type] || {label:f.type};
        items.push({id:`flag-${f.id}`, label:`عائق فعّال على تسجيلك: ${t.label}`, time:fmtDateTime(f.setAt), action:()=>navigate('myprofile')});
      });
    }
    const openSemesters = (await dbGetAll('semesters')).filter(s=>s.regOpen);
    openSemesters.forEach(s=> items.push({id:`sem-${s.id}`, label:`فصل دراسي مفتوح للتسجيل: ${s.name}`, time:null, action:()=>navigate('myregistration',{semId:s.id})}));
    const myRequests = (await dbGetAllByIndex('registrationRequests','studentId', currentUser.id)).sort((a,b)=> new Date(b.submittedAt)-new Date(a.submittedAt)).slice(0,5);
    myRequests.forEach(r=> items.push({id:`req-${r.id}-${r.status}`, label:`حالة طلب تسجيلك: ${r.status==='approved'?'معتمد':(r.status==='rejected'?'مرفوض':'قيد المراجعة')}`, time:fmtDateTime(r.submittedAt), action:()=>navigate('myregistration',{semId:r.semesterId})}));
  }
  return items;
}
/* مفتاح إعداد "الإشعارات المقروءة" مستقل لكل مستخدم (موظف بحسب username، طالب
   بحسب الرقم الجامعي) — القراءة تُعلَّم بمعرّف كل إشعار (انظر computeNotifItems)
   بحيث يعود الإشعار "غير مقروء" تلقائيًا إن تغيّر مضمونه (كتغيّر حالة طلب). */
function notifReadKey(){ return 'notifRead__' + (currentUser.type==='staff' ? currentUser.username : currentUser.id); }
async function getReadNotifIds(){ return new Set((await getSetting(notifReadKey())) || []); }
async function markNotifIdsRead(ids){
  const set = await getReadNotifIds();
  ids.forEach(id=> set.add(id));
  await setSetting(notifReadKey(), [...set]);
}
async function refreshNotifBadge(){
  try{
    const items = await computeNotifItems();
    const readIds = await getReadNotifIds();
    const unread = items.filter(it=> !readIds.has(it.id));
    const dot = document.getElementById('bellDot');
    if(!dot) return;
    if(unread.length){ dot.style.display='flex'; dot.textContent = unread.length>99?'99+':String(unread.length); }
    else{ dot.style.display='none'; }
  }catch(e){ /* تجاهل */ }
}
let __notifItemsCache = [];
async function toggleNotifPanel(e){
  if(e) e.stopPropagation();
  const panel = document.getElementById('notifPanel');
  if(panel.classList.contains('show')){ panel.classList.remove('show'); return; }
  const items = await computeNotifItems();
  const readIds = await getReadNotifIds();
  __notifItemsCache = items;
  panel.innerHTML = `<div class="np-head">🔔 الإشعارات</div>` + (items.length? items.map((it,i)=>{
    const isRead = readIds.has(it.id);
    return `<div class="notif-item ${isRead?'read':'unread'}" onclick="__notifItemsCache[${i}].action(); document.getElementById('notifPanel').classList.remove('show');">
      <div class="ni-label">${escapeHtml(it.label)}</div>${it.time? `<div class="ni-t">${escapeHtml(it.time)}</div>`:''}
    </div>`;
  }).join('') : `<div class="notif-item" style="cursor:default;">لا توجد إشعارات جديدة</div>`);
  panel.classList.add('show');
  // بمجرد فتح الجرس وعرض الإشعارات، تُعتبر "مقروءة" فتتغيّر شكلًا (تخفت وتفقد
  // النقطة الذهبية) ويصفر عدّاد الجرس، حتى لو ظهر إشعار جديد لاحقًا بمعرّف مختلف.
  if(items.length){ await markNotifIdsRead(items.map(it=>it.id)); await refreshNotifBadge(); }
}
document.addEventListener('click', function(e){
  const panel = document.getElementById('notifPanel');
  const bell = document.getElementById('bellBtn');
  if(panel && panel.classList.contains('show') && !panel.contains(e.target) && e.target!==bell){ panel.classList.remove('show'); }
});
