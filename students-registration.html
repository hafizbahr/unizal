async function runGlobalSearch(qRaw){
  const q = String(qRaw||'').trim().toLowerCase();
  const box = document.getElementById('globalSearchResults');
  if(!box) return;
  if(q.length<2){ box.innerHTML = '<div class="muted">اكتب حرفين على الأقل لبدء البحث.</div>'; return; }
  const groups = [];
  if(currentUser.type==='staff'){
    const scope = myCollegeScope();
    let students = (await dbGetAll('students')).filter(s=>!s.deleted && (!scope||s.college===scope));
    students = students.filter(s=> s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q) || (s.regNo||'').toLowerCase().includes(q)).slice(0,8);
    if(students.length) groups.push({title:'طلاب', items: students.map(s=>({label:`${s.name} — ${s.id}`, action:()=>navigate('studentDetail',{id:s.id})}))});

    let courses = (await dbGetAll('courses')).filter(c=>!scope||c.college===scope);
    courses = courses.filter(c=> c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q)).slice(0,8);
    if(courses.length) groups.push({title:'مقررات', items: courses.map(c=>({label:`${c.code} — ${c.name}`, action:()=>navigate('courses')}))});

    let depts = (await dbGetAll('departments')).filter(d=>!scope||d.college===scope);
    depts = depts.filter(d=> d.name.toLowerCase().includes(q) || d.code.toLowerCase().includes(q)).slice(0,8);
    if(depts.length) groups.push({title:'أقسام', items: depts.map(d=>({label:`${d.code} — ${d.name}`, action:()=>navigate('departments')}))});
  } else {
    const student = await dbGet('students', currentUser.id);
    if(student && (student.name.toLowerCase().includes(q) || student.id.toLowerCase().includes(q) || (student.regNo||'').toLowerCase().includes(q))){
      groups.push({title:'بياناتي', items:[{label:`${student.name} — ${student.id}`, action:()=>navigate('myprofile')}]});
    }
  }
  window.__searchResultGroups = groups;
  if(!groups.length){ box.innerHTML = '<div class="muted">لا توجد نتائج مطابقة.</div>'; return; }
  box.innerHTML = groups.map((g,gi)=> `<div class="search-group-title">${escapeHtml(g.title)}</div>` +
    g.items.map((it,ii)=> `<div class="search-result-item" onclick="window.__searchResultGroups[${gi}].items[${ii}].action(); closeModal();"><span>${escapeHtml(it.label)}</span></div>`).join('')
  ).join('');
}

function matchCollegeFromText(text){
  const t = String(text||'').trim().toLowerCase();
  if(!t) return null;
  const byKey = COLLEGES.find(c=>c.key.toLowerCase()===t);
  if(byKey) return byKey.key;
  const byLabel = COLLEGES.find(c=> c.label.toLowerCase()===t || c.label.toLowerCase().includes(t) || t.includes(c.label.toLowerCase()));
  return byLabel ? byLabel.key : null;
}

async function submitBulkDepartments(){
  const scope = myCollegeScope();
  const err = document.getElementById('dpb-err'); err.classList.remove('show');
  const fileInput = document.getElementById('dpb-file');
  if(!fileInput.files[0]){ err.textContent='الرجاء اختيار الملف'; err.classList.add('show'); return; }
  let rows;
  try{ rows = await readSpreadsheetRows(fileInput.files[0]); }
  catch(e){ err.textContent='تعذّر قراءة الملف — تأكد أنه Excel أو CSV صحيح'; err.classList.add('show'); return; }
  if(!rows.length){ err.textContent='الملف فارغ'; err.classList.add('show'); return; }
  const nameKey = findColumnKey(rows[0], ['اسمالقسم','القسم','اسمالتخصص','name']);
  const codeKey = findColumnKey(rows[0], ['الرمز','رمزالقسم','code']);
  const collegeKey = findColumnKey(rows[0], ['الكلية','college']);
  if(!nameKey || !codeKey){ err.textContent='تعذّر التعرّف على عمودي «اسم القسم» و«الرمز» — تحقق من عناوين الأعمدة'; err.classList.add('show'); return; }
  const created=[], skipped=[];
  for(const row of rows){
    const name = String(row[nameKey]||'').trim();
    const code = String(row[codeKey]||'').trim();
    const college = scope || (collegeKey ? matchCollegeFromText(row[collegeKey]) : null);
    if(!name || !code){ skipped.push({name, code, reason:'صف بدون اسم أو رمز'}); continue; }
    if(!college){ skipped.push({name, code, reason:'تعذّر تحديد الكلية'}); continue; }
    const id = college+'__'+code;
    try{
      const existing = await dbGet('departments', id);
      if(existing) throw new Error('الرمز مستخدم مسبقًا لقسم آخر في نفس الكلية');
      await dbPut('departments', {id, name, code, college});
      created.push({name, code, college});
    }catch(e){ skipped.push({name, code, reason:e.message||'خطأ غير معروف'}); }
  }
  await addLog('استيراد أقسام جماعي', `${created.length} قسم تم إضافتهم، ${skipped.length} تم تخطّيهم`);
  closeModal();
  openModal('نتيجة استيراد الأقسام', `
    <div class="hint-box good-box">تم إضافة ${created.length} قسمًا بنجاح.</div>
    ${skipped.length? `<div class="hint-box warn-box">تم تخطّي ${skipped.length} صف: ${skipped.map(s=>escapeHtml((s.name||s.code||'—'))+' ('+escapeHtml(s.reason)+')').join('، ')}</div>`:''}
  `, `<button class="btn btn-gold" onclick="closeModal(); navigate('departments');">حسنًا</button>`);
}

/* ==================== إنشاء سجل «طالب حالي» مستورَد (وليس طالبًا جديدًا) ====================
   يُستخدم عند ترحيل طلاب موجودين فعلاً في الواقع إلى النظام: رقم التسجيل
   يُعطى صراحةً (لا يُولَّد)، والمستوى/الفصل الدراسي الحالي يُعطى صراحةً أيضًا
   (بخلاف كشوفات القبول الجديدة التي تبدأ دائمًا من المستوى 1 تلقائيًا). */
async function createExistingStudentRecord(data){
  const { studentId, regNo, name, college, departmentId, specialization, batch, currentLevel, resultStatusRaw } = data;
  if(!studentId) throw new Error('الرجاء إدخال الرقم الجامعي/الاستمارة');
  if(!regNo) throw new Error('الرجاء إدخال رقم التسجيل');
  if(!name) throw new Error('الرجاء إدخال اسم الطالب');
  if(!college) throw new Error('الرجاء اختيار الكلية');
  if(!departmentId) throw new Error('الرجاء اختيار القسم/التخصص');
  const lvl = parseInt(currentLevel,10);
  if(!lvl || lvl<1) throw new Error('الفصل الدراسي الحالي غير صالح');
  const allStudents = await dbGetAll('students');
  if(allStudents.some(s=>s.id===studentId)) throw new Error(`الرقم الجامعي "${studentId}" مستخدم مسبقًا`);
  if(allStudents.some(s=>s.regNo===regNo)) throw new Error(`رقم التسجيل "${regNo}" مستخدم مسبقًا`);
  const dept = await dbGet('departments', departmentId);
  const tempPw = genTempPassword();
  const row = {
    id: studentId, name, college, departmentId, department: dept?dept.name:null,
    specialization: (specialization&&specialization.trim()) ? specialization.trim() : (dept?dept.name:null),
    secondarySchool: null, regNo, gender: null, batch: batch?String(batch):null, phone: null, email:null,
    notes: null,
    status:'active', isGraduate:false, completedCourses:[],
    currentLevel: lvl, blockFlags:[], levelAdvancedForSemesters:[],
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), deleted:false,
  };
  if(resultStatusRaw && String(resultStatusRaw).trim()){
    row.priorResultStatus = normalizeClearanceStatus(resultStatusRaw);
    row.priorResultForLevel = lvl;
    row.priorResultNote = 'مستوردة من السجل الأكاديمي الإلكتروني عبر أداة إضافة مجموعة طلاب حاليين';
  }
  await dbPut('students', row);
  await setStudentPassword(studentId, tempPw, true);
  return {row, tempPw};
}

/* ==================== حذف طالب — فردي أو جماعي (حذف منطقي/soft-delete) ====================
   لا يُحذف السجل فعليًا من القاعدة بل يُعلَّم deleted:true مع توقيت ومنفِّذ
   الحذف، فتبقى سجلاته التاريخية (تسجيلات فصلية، دفعات مالية...) قابلة للتدقيق
   لاحقًا عند الحاجة، ويختفي فورًا من كل القوائم والتقارير النشطة. يمكن استرجاعه
   لاحقًا من تبويب «المحذوفون» (انظر renderTrash/restoreStudent). الإجراء يتطلب
   صلاحية canManageStudents ويُسجَّل في سجل الأحداث دائمًا. */
async function softDeleteStudent(id){
  const student = await dbGet('students', id);
  if(!student) return;
  student.deleted = true; student.deletedAt = new Date().toISOString();
  student.deletedBy = currentUser.type==='staff' ? currentUser.username : null;
  student.updatedAt = new Date().toISOString();
  await dbPut('students', student);
  await addLog('حذف طالب', `${student.name} — ${student.id}`);
}
async function restoreStudent(id){
  const student = await dbGet('students', id);
  if(!student) return;
  student.deleted = false; student.deletedAt = null; student.deletedBy = null;
  student.updatedAt = new Date().toISOString();
  await dbPut('students', student);
  await addLog('استرجاع طالب من المحذوفين', `${student.name} — ${student.id}`);
  toast('تم استرجاع الطالب'); navigate('trash');
}

// يستدعي Edge Function اختيارية (admin-reset-password) لمزامنة كلمة مرور
// الطالب السحابية بأمان — service_role لا يمكن استخدامه مباشرة من المتصفح،
// فتُنفَّذ العملية على خادم Supabase نفسه. إن لم تُنشر هذه الدالة على مشروع
// المستخدم بعد، تفشل المحاولة بأمان دون أي تأثير على التحديث المحلي.
async function syncCloudPasswordViaEdgeFunction(studentId, newPassword){
  try{
    const url = await getSetting('supabaseUrl'); const key = await getSetting('supabaseAnonKey');
    if(!url || !key || typeof navigator==='undefined' || !navigator.onLine) return {ok:false, reason:'offline_or_unconfigured'};
    const client = await ensureSupabaseClient();
    if(!client) return {ok:false, reason:'offline_or_unconfigured'};
    const { data: sessionData } = await client.auth.getSession();
    const accessToken = sessionData && sessionData.session ? sessionData.session.access_token : null;
    if(!accessToken) return {ok:false, reason:'no_session'};
    const resp = await withTimeout(fetch(`${url.replace(/\/$/,'')}/functions/v1/admin-reset-password`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${accessToken}`, 'apikey': key },
      body: JSON.stringify({studentId, newPassword}),
    }), 10000, 'SUPABASE_TIMEOUT');
    const result = await resp.json().catch(()=>({}));
    if(!resp.ok) return {ok:false, reason: result.error || 'server_error'};
    return {ok:true};
  }catch(e){ return {ok:false, reason:'network_error'}; }
}
function cloudPasswordSyncReasonLabel(reason){
  const known = {offline_or_unconfigured:'غير متصل بالإنترنت أو المزامنة السحابية غير مُهيَّأة', no_session:'لا توجد جلسة دخول سحابية نشطة لحسابك الحالي — سجّل خروجك ثم ادخل من جديد', network_error:'تعذّر الاتصال بالخادم'};
  return known[reason] || `الدالة (admin-reset-password) غير منشورة بعد على مشروعك، أو حدث خطأ: ${reason}`;
}
async function confirmResetStudentPassword(id){
  const tempPw = genTempPassword();
  const student = await dbGet('students', id);
  await setStudentPassword(id, tempPw, true);
  await addLog('إعادة تعيين كلمة مرور طالب', id);
  let cloudNote = '';
  if(supabaseClient){
    const cloudResult = await syncCloudPasswordViaEdgeFunction(id, tempPw);
    cloudNote = cloudResult.ok
      ? `<div class="hint-box good-box" style="margin-top:10px;">✅ تمت أيضًا مزامنة كلمة المرور هذه مباشرةً مع حساب الطالب السحابي (Supabase Auth) عبر Edge Function.</div>`
      : `<div class="hint-box mid-box" style="margin-top:10px;">كلمة المرور هذه تعمل فورًا محليًا (وتُزامَن عبر جدول الطلاب كسائر البيانات)، لكن تعذّرت مزامنتها المباشرة مع حساب Supabase Auth السحابي للطالب: ${escapeHtml(cloudPasswordSyncReasonLabel(cloudResult.reason))}. ستُحل تلقائيًا حين يغيّر الطالب كلمة مروره بنفسه لاحقًا وهو متصل بالإنترنت — أو انشر ملف supabase-edge-function-reset-password.ts المرفق مع النظام لتفعيل المزامنة الفورية.</div>`;
  }
  window.__lastCreatedStudentCred = {student, tempPw};
  openModal('تم إنشاء كلمة مرور جديدة', `<div class="hint-box good-box">كلمة المرور المؤقتة الجديدة: <b style="font-size:18px;">${escapeHtml(tempPw)}</b></div>${cloudNote}`,
    `<button class="btn btn-outline" onclick="printCredentialsSlip(window.__lastCreatedStudentCred.student, window.__lastCreatedStudentCred.tempPw)">🖨️ طباعة بطاقة الدخول</button>
    <button class="btn btn-gold" onclick="closeModal(); navigate('studentDetail',{id:'${id}'});">حسنًا</button>`);
}

async function openManualRegisterModal(studentId){
  const student = await dbGet('students', studentId);
  const semesters = await dbGetAll('semesters');
  openModal('تسجيل/تعديل يدوي في مقرر', `
    <p class="muted">لتصحيحات إدارية فقط — يتجاوز خطوة الإيصال المالي ويُسجَّل مباشرة كـ«معتمد».</p>
    <div class="field"><label for="mr-sem">الفصل الدراسي</label><select id="mr-sem" onchange="refreshManualRegisterOfferings('${studentId}')">${semesters.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('') || '<option value="">لا توجد فصول</option>'}</select></div>
    <div class="field"><label for="mr-off">المادة</label><select id="mr-off"></select></div>
    <div class="err-text" id="mr-err"></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-gold" onclick="submitManualRegister('${studentId}')">تسجيل معتمد</button>
  `);
  if(semesters.length) refreshManualRegisterOfferings(studentId);
}
async function refreshManualRegisterOfferings(studentId){
  const student = await dbGet('students', studentId);
  const semId = document.getElementById('mr-sem').value;
  const offerings = (await dbGetAllByIndex('offerings','semesterId', semId)).filter(o=>o.college===student.college);
  const courses = await dbGetAll('courses');
  document.getElementById('mr-off').innerHTML = offerings.map(o=>{ const c=courses.find(x=>x.id===o.courseId); return `<option value="${o.id}">${escapeHtml(c?c.code+' — '+c.name:'')}</option>`; }).join('') || '<option value="">لا توجد مواد لهذا الفصل</option>';
}
async function submitManualRegister(studentId){
  const semId = document.getElementById('mr-sem').value;
  const offeringId = document.getElementById('mr-off').value;
  const err = document.getElementById('mr-err'); err.classList.remove('show');
  if(!offeringId){ err.textContent='الرجاء اختيار مادة'; err.classList.add('show'); return; }
  const off = await dbGet('offerings', offeringId);
  const course = await dbGet('courses', off.courseId);
  const existing = (await dbGetAllByIndex('registrations','studentId', studentId)).find(r=> r.offeringId===offeringId && (r.status==='registered'||r.status==='pending'));
  if(existing){ err.textContent='الطالب مسجّل بالفعل في هذه المادة'; err.classList.add('show'); return; }

async function submitCourse(editId){
  const scope = myCollegeScope();
  const code = document.getElementById('cs-code').value.trim();
  const name = document.getElementById('cs-name').value.trim();
  const collegeEl = document.getElementById('cs-college');
  const college = scope || (collegeEl?collegeEl.value:'');
  const hours = parseInt(document.getElementById('cs-hours').value,10)||3;
  const level = document.getElementById('cs-level').value.trim();
  const err = document.getElementById('cs-err'); err.classList.remove('show');
  if(!code){ err.textContent='الرجاء إدخال رمز المقرر'; err.classList.add('show'); return; }
  if(!name){ err.textContent='الرجاء إدخال اسم المقرر'; err.classList.add('show'); return; }
  if(!college){ err.textContent='الرجاء اختيار الكلية'; err.classList.add('show'); return; }
  const id = editId || code;
  if(!editId){ const existing = await dbGet('courses', id); if(existing){ err.textContent='رمز المقرر مستخدم مسبقًا'; err.classList.add('show'); return; } }
  const prereqs = (window.__allCoursesForPrereq||[]).filter(c=> document.getElementById('pr-'+c.id) && document.getElementById('pr-'+c.id).checked).map(c=>c.id);
  const row = {id, code, name, college, creditHours:hours, level: level||null, prerequisites:prereqs};
  await dbPut('courses', row);
  await addLog(editId?'تعديل مقرر':'إضافة مقرر', `${name} (${code})`);
  closeModal(); toast('تم الحفظ'); navigate('courses');
}

async function submitBulkCourses(){
  const scope = myCollegeScope();
  const err = document.getElementById('csb-err'); err.classList.remove('show');
  const fileInput = document.getElementById('csb-file');
  if(!fileInput.files[0]){ err.textContent='الرجاء اختيار الملف'; err.classList.add('show'); return; }
  let rows;
  try{ rows = await readSpreadsheetRows(fileInput.files[0]); }
  catch(e){ err.textContent='تعذّر قراءة الملف — تأكد أنه Excel أو CSV صحيح'; err.classList.add('show'); return; }
  if(!rows.length){ err.textContent='الملف فارغ'; err.classList.add('show'); return; }
  const codeKey = findColumnKey(rows[0], ['رمزالمقرر','الرمز','code']);
  const nameKey = findColumnKey(rows[0], ['اسمالمقرر','الاسم','name']);
  const hoursKey = findColumnKey(rows[0], ['الساعاتالمعتمدة','الساعات','hours']);
  const levelKey = findColumnKey(rows[0], ['الفصلالدراسي','المستوى','الفصل','level']);
  const collegeKey = findColumnKey(rows[0], ['الكلية','college']);
  if(!codeKey || !nameKey){ err.textContent='تعذّر التعرّف على عمودي «رمز المقرر» و«اسم المقرر» — تحقق من عناوين الأعمدة'; err.classList.add('show'); return; }
  const created=[], skipped=[];
  for(const row of rows){
    const code = String(row[codeKey]||'').trim();
    const name = String(row[nameKey]||'').trim();
    const college = scope || (collegeKey ? matchCollegeFromText(row[collegeKey]) : null);
    const hours = hoursKey ? (parseInt(String(row[hoursKey]||'').trim(),10)||3) : 3;
    const level = levelKey ? String(row[levelKey]||'').trim() : '';
    if(!code || !name){ skipped.push({name, code, reason:'صف بدون رمز أو اسم'}); continue; }
    if(!college){ skipped.push({name, code, reason:'تعذّر تحديد الكلية'}); continue; }
    try{
      const existing = await dbGet('courses', code);
      if(existing) throw new Error('رمز المقرر مستخدم مسبقًا');
      await dbPut('courses', {id:code, code, name, college, creditHours:hours, level: level||null, prerequisites:[]});
      created.push({name, code, college});
    }catch(e){ skipped.push({name, code, reason:e.message||'خطأ غير معروف'}); }
  }
  await addLog('استيراد مقررات جماعي', `${created.length} مقرر تم إضافتهم، ${skipped.length} تم تخطّيهم`);
  closeModal();
  openModal('نتيجة استيراد المقررات', `
    <div class="hint-box good-box">تم إضافة ${created.length} مقررًا بنجاح.</div>
    ${skipped.length? `<div class="hint-box warn-box">تم تخطّي ${skipped.length} صف: ${skipped.map(s=>escapeHtml((s.name||s.code||'—'))+' ('+escapeHtml(s.reason)+')').join('، ')}</div>`:''}
  `, `<button class="btn btn-gold" onclick="closeModal(); navigate('courses');">حسنًا</button>`);
}

function openCurriculumLevelModal(departmentId, existingLevel){
  Promise.all([dbGet('departments', departmentId), dbGetAll('courses'), dbGetAllByIndex('curricula','departmentId', departmentId)]).then(([dept, allCourses, existingCurricula])=>{
    const courses = allCourses.filter(c=>c.college===dept.college);
    const editId = (existingLevel!=null) ? departmentId+'__'+existingLevel : null;
    const takenLevels = new Set(existingCurricula.map(c=>c.level));
    (editId ? dbGet('curricula', editId) : Promise.resolve(null)).then(editing=>{
      const selected = new Set((editing&&editing.courseIds)||[]);
      window.__curCourses = courses;
      // قائمة الفصول الدراسية نصية دائمًا (الفصل الدراسي الأول، الثاني...) — عند
      // الإضافة تُستبعَد الفصول المُعرَّفة مسبقًا لهذا القسم (لكل فصل سجل منهج
      // واحد فقط، ويُعدَّل عبر زر "✏️" لا بإعادة إضافته من هنا).
      const levelOptions = Array.from({length:12},(_,i)=>i+1).filter(n=> editing ? n===editing.level : !takenLevels.has(n));
      openModal(editing?`تعديل مقررات ${semesterLabel(existingLevel)}`:'إضافة مقررات لفصل دراسي', `
        <div class="field"><label for="cu-level">الفصل الدراسي</label>
          ${editing
            ? `<input value="${escapeHtml(semesterLabel(editing.level))}" disabled>`
            : `<select id="cu-level">${levelOptions.length? levelOptions.map(n=>`<option value="${n}">${escapeHtml(semesterLabel(n))}</option>`).join('') : '<option value="">— كل الفصول معرَّفة بالفعل لهذا القسم —</option>'}</select>`}
        </div>
        <div class="field"><label>مقررات هذا الفصل الدراسي (ثابتة لجميع طلاب القسم فيه)</label>
          <div style="max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;">
            ${courses.map(c=>`<div class="checkrow" style="padding:4px 0;"><input type="checkbox" id="cu-${c.id}" ${selected.has(c.id)?'checked':''}><label for="cu-${c.id}">${escapeHtml(c.code)} — ${escapeHtml(c.name)} (${c.creditHours} س)${c.level? ` <span class="muted" style="font-size:11px;">— مستوى الدليل: ${escapeHtml(String(c.level))}</span>`:''}</label></div>`).join('') || '<div class="muted">لا توجد مقررات في دليل كلية هذا القسم بعد — أضفها أولًا من «دليل المقررات».</div>'}
          </div>
          <div class="muted" style="font-size:11.5px;margin-top:6px;">حقل «الفصل الدراسي» في دليل المقررات (إن وُجد) معلوماتي فقط لمساعدتك على الاختيار هنا — الفعلي والمُلزِم للطالب هو تجميع المقررات ضمن هذا الفصل الدراسي، بصرف النظر عن قيمة ذلك الحقل.</div>
        </div>
        <div class="err-text" id="cu-err"></div>
      `, `
        <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-gold" onclick="submitCurriculumLevel('${departmentId}', ${editing?editing.level:'null'})">حفظ</button>
      `);
    });
  });
}
async function submitCurriculumLevel(departmentId, editingLevel){
  const level = editingLevel!=null ? editingLevel : parseInt(document.getElementById('cu-level').value,10);
  const err = document.getElementById('cu-err'); err.classList.remove('show');
  if(!level || level<1){ err.textContent='الرجاء اختيار فصل دراسي'; err.classList.add('show'); return; }
  const courses = window.__curCourses||[];
  const courseIds = courses.filter(c=> document.getElementById('cu-'+c.id) && document.getElementById('cu-'+c.id).checked).map(c=>c.id);
  const id = departmentId+'__'+level;
  await dbPut('curricula', {id, departmentId, level, courseIds, updatedAt:new Date().toISOString()});
  await addLog('حفظ مقررات فصل دراسي بالمنهج', `${departmentId} — ${semesterLabel(level)} (${courseIds.length} مقررًا)`);
  closeModal(); toast('تم الحفظ'); navigate('curricula',{deptId:departmentId});
}

  let rows;
  try{ rows = await readSpreadsheetRows(fileInput.files[0]); }
  catch(e){ err.textContent='تعذّر قراءة الملف — تأكد أنه Excel أو CSV صحيح'; err.classList.add('show'); return; }
  if(!rows.length){ err.textContent='الملف فارغ'; err.classList.add('show'); return; }
  const codeKey = findColumnKey(rows[0], ['رمزالمقرر','الرمز','code']);
  const levelKey = findColumnKey(rows[0], ['الفصلالدراسي','المستوى','الفصل','level']);
  if(!codeKey || !levelKey){ err.textContent='تعذّر التعرّف على عمودي «رمز المقرر» و«الفصل الدراسي» — تحقق من عناوين الأعمدة'; err.classList.add('show'); return; }
  const collegeCourses = (await dbGetAll('courses')).filter(c=>c.college===dept.college);
  const byLevel = {}; // level -> Set(courseIds)
  const skipped = [];
  let created = 0;
  for(const row of rows){
    const code = String(row[codeKey]||'').trim();
    const levelRaw = String(row[levelKey]||'').trim();
    const level = parseInt(levelRaw,10);
    if(!code || !level || level<1){ skipped.push({code, level:levelRaw, reason:'رمز مقرر أو فصل دراسي مفقود/غير صالح'}); continue; }
    const course = collegeCourses.find(c=>c.code===code);
    if(!course){ skipped.push({code, level:levelRaw, reason:'رمز المقرر غير موجود في دليل مقررات كلية هذا القسم'}); continue; }
    if(!byLevel[level]) byLevel[level] = new Set();
    if(!byLevel[level].has(course.id)) created++;
    byLevel[level].add(course.id);
  }
  for(const levelStr of Object.keys(byLevel)){
    const level = parseInt(levelStr,10);
    const id = departmentId+'__'+level;
    const existing = await dbGet('curricula', id);
    const merged = new Set((existing&&existing.courseIds)||[]);
    byLevel[level].forEach(cid=> merged.add(cid));
    await dbPut('curricula', {id, departmentId, level, courseIds:[...merged], updatedAt:new Date().toISOString()});
  }
  await addLog('استيراد منهج من ملف', `${dept.name} — ${created} مقرر مُضاف/مدموج عبر ${Object.keys(byLevel).length} فصل دراسي، ${skipped.length} صف متخطّى`);
  toast(`تم الاستيراد: ${created} إضافة، ${skipped.length} صف متخطّى`);
  closeModal();
  openModal('نتيجة استيراد المنهج', `
    <div class="hint-box good-box">تم دمج ${created} مقررًا ضمن ${Object.keys(byLevel).length} فصل دراسي بنجاح.</div>
    ${skipped.length? `<div class="hint-box warn-box">تم تخطّي ${skipped.length} صف: ${skipped.map(s=>escapeHtml((s.code||'—')+' / '+(s.level||'—'))+' ('+escapeHtml(s.reason)+')').join('، ')}</div>`:''}
  `, `<button class="btn btn-gold" onclick="closeModal(); navigate('curricula',{deptId:'${departmentId}'});">حسنًا</button>`);
}

/* ==================== تسجيل جديد — ترقية وتسجيل الطلاب الحاليين جماعيًا ====================
   الغرض: عند افتتاح فصل دراسي جديد، ترقية قيد كل الطلاب المستمرين المؤهَّلين
   دفعة واحدة (مستواهم +1) بدل مراجعة كل طالب يدويًا، بعد التحقق أولًا من خلوّهم
   من كل عوائق التسجيل الستة (مالية، أكاديمية، رسوب/ملحق، غش، تجميد، فصل —
   محسوبة عبر getStudentClearanceForRegistration نفسها المستخدمة في بوابة تسجيل
   الطالب الذاتي، فلا يوجد أي ازدواج في المعايير بين المسارين). لا يُنشئ هذا
   الإجراء تسجيلًا بمقررات بعينها ولا يحصّل أي رسوم — فقط يُرقّي مستوى القيد
   ويُعلِّم الطالب كمُرقّى لهذا الفصل (levelAdvancedForSemesters) بحيث يصبح
   بإمكانه بعدها التسجيل بنفسه بمقررات مستواه الجديد من تبويب «تسجيل الفصل»
   الخاص به، أو أن يسجّله الموظف يدويًا إن رغب.
   ملاحظة: لا يشمل هذا طلاب الفصل الأول (يُسجَّلون عبر «كشوفات القبول» مباشرة). */
async function renderNewRegistration(){
  const scope = myCollegeScope();
  const semesters = (await dbGetAll('semesters')).sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0));
  const semId = viewParams.semId || (semesters[0]||{}).id || '';
  const vp = document.getElementById('viewport');
  if(!semId){ vp.innerHTML = `<div class="card empty-state"><div class="icon">📅</div><h3>أنشئ فصلًا دراسيًا أولاً من تبويب «الفصول الدراسية»</h3></div>`; return; }
  const sem = semesters.find(s=>s.id===semId);
  let students = (await dbGetAll('students')).filter(s=>!s.deleted && !s.isGraduate && (!scope||s.college===scope));
  students.sort((a,b)=> a.name.localeCompare(b.name,'ar'));

  const rows = [];
  for(const s of students){
    const alreadyAdvanced = (s.levelAdvancedForSemesters||[]).includes(semId);
    const clearance = await getStudentClearanceForRegistration(s.id);
    rows.push({student:s, alreadyAdvanced, clearance});
  }
  const eligible = rows.filter(r=>!r.alreadyAdvanced && r.clearance.ok);
  const blocked = rows.filter(r=>!r.alreadyAdvanced && !r.clearance.ok);
  const done = rows.filter(r=>r.alreadyAdvanced);

  vp.innerHTML = `
    <div class="card">
      <h2>🆕 تسجيل جديد — ترقية وتسجيل الطلاب الحاليين${scope?' — '+escapeHtml(collegeLabel(scope)):''}</h2>
      <p class="muted" style="line-height:1.9;">يُرقّي هذا الإجراء مستوى القيد (الفصل الدراسي) لكل طالب مستمر مُحدَّد ومؤهَّل — بعد التأكد أولًا من خلوّه من كل عوائق التسجيل (مالية، أكاديمية، رسوب/ملحق، غش، تجميد، فصل) — تمهيدًا لتسجيله بمقررات الفصل الجديد. طلاب الفصل الأول يُسجَّلون عبر «كشوفات القبول» مباشرة وليس من هنا.</p>
      <div class="field" style="max-width:420px;"><label>الفصل الدراسي الجديد</label>
        <select onchange="navigate('newRegistration',{semId:this.value})">${semesters.map(s=>`<option value="${s.id}" ${s.id===semId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select>
      </div>
      <div class="stat-grid" style="margin-top:14px;">
        ${statCard('✅', eligible.length, 'مؤهَّلون للترقية الآن')}
        ${statCard('⛔', blocked.length, 'محجوبون بعائق تسجيل')}
        ${statCard('🏁', done.length, 'مُرقَّون بالفعل لهذا الفصل')}
      </div>
      ${eligible.length? `<button class="btn btn-gold" id="bulkPromoteBtn" onclick="openBulkPromoteConfirm('${semId}')" style="margin-top:14px;">⬆️ ترقية جميع المؤهَّلين المحدَّدين (<span id="bulkPromoteCount">${eligible.length}</span>)</button>`:''}
    </div>
    <div class="card">
      <h2>قائمة الطلاب <span class="eyebrow">${rows.length}</span></h2>
      <div class="table-wrap">
      <table>
        <thead><tr>${eligible.length?'<th class="fit"><input type="checkbox" id="npSelectAll" checked onchange="toggleAllPromoteChecks(this)"></th>':''}<th>الرقم الجامعي</th><th>الاسم</th><th>المستوى الحالي</th><th>الحالة</th></tr></thead>
        <tbody>
        ${rows.map(r=>{
          const disabled = r.alreadyAdvanced || !r.clearance.ok;
          const statusHtml = r.alreadyAdvanced
            ? `<span class="pill pill-good">مُرقَّى بالفعل — أصبح ${escapeHtml(semesterLabel((r.student.currentLevel||1)))}</span>`
            : r.clearance.ok
              ? `<span class="pill pill-good">مؤهَّل → سيصبح ${escapeHtml(semesterLabel((r.student.currentLevel||1)+1))}</span>`
              : `<span class="pill pill-warn" title="${escapeHtml(r.clearance.reasons.map(x=>x.label).join('، '))}">${escapeHtml(r.clearance.reasons.map(x=>x.label).join('، '))}</span>`;
          return `<tr>
            ${eligible.length?`<td class="fit">${disabled?'':`<input type="checkbox" class="promote-check" value="${r.student.id}" checked onchange="updatePromoteCount()">`}</td>`:''}
            <td>${escapeHtml(r.student.id)}</td>
            <td>${escapeHtml(r.student.name)}</td>
            <td>${escapeHtml(semesterLabel(r.student.currentLevel||1))}</td>
            <td>${statusHtml}</td>
          </tr>`;
        }).join('') || `<tr><td colspan="5" class="muted" style="text-align:center;padding:20px;">لا يوجد طلاب حاليون بهذا النطاق</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  `;
}
function updatePromoteCount(){
  const n = document.querySelectorAll('.promote-check:checked').length;
  const el = document.getElementById('bulkPromoteCount');
  if(el) el.textContent = String(n);
  const btn = document.getElementById('bulkPromoteBtn');
  if(btn) btn.disabled = n===0;
  const all = document.querySelectorAll('.promote-check');
  const selectAll = document.getElementById('npSelectAll');
  if(selectAll) selectAll.checked = all.length>0 && n===all.length;
}
function toggleAllPromoteChecks(el){
  document.querySelectorAll('.promote-check').forEach(c=> c.checked = el.checked);
  updatePromoteCount();
}
function openBulkPromoteConfirm(semId){
  const ids = [...document.querySelectorAll('.promote-check:checked')].map(c=>c.value);
  if(!ids.length) return;
  window.__bulkPromoteIds = ids;
  openModal('تأكيد الترقية الجماعية', `
    <div class="hint-box">سيُرقَّى <b>${ids.length}</b> طالبًا لمستوى الفصل التالي فورًا، ويصبح بإمكانهم تسجيل مقررات فصلهم الجديد. هذا الإجراء لا يُنشئ أي تسجيل بمقررات بعينها ولا يُحصِّل رسومًا — فقط يُرقّي مستوى القيد.</div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-gold" onclick="confirmBulkPromote('${semId}')">تأكيد الترقية (${ids.length})</button>
  `);
}
async function confirmBulkPromote(semId){
  const ids = window.__bulkPromoteIds||[];
  let promoted = 0;
  for(const id of ids){
    const student = await dbGet('students', id);
    if(!student) continue;
    const advancedFor = new Set(student.levelAdvancedForSemesters||[]);
    if(advancedFor.has(semId)) continue; // تحقق مزدوج تحسبًا لتغيّر البيانات أثناء المراجعة
    student.currentLevel = (student.currentLevel||1) + 1;
    advancedFor.add(semId);
    student.levelAdvancedForSemesters = [...advancedFor];
    student.updatedAt = new Date().toISOString();
    await dbPut('students', student);
    promoted++;
  }
  const sem = await dbGet('semesters', semId);
  await addLog('ترقية جماعية للفصل الدراسي الجديد', `${sem?sem.name:semId} — ${promoted} طالب`);
  window.__bulkPromoteIds = null;
  closeModal(); toast(`تمت ترقية ${promoted} طالبًا بنجاح`); navigate('newRegistration',{semId});
}


/* ---- استيراد نتيجة الفصل (اعتماد التسجيل القادم) ---- */
function openImportClearanceModal(semId){
  openModal('استيراد نتيجة الفصل واعتماد التسجيل القادم', `
    <p class="muted" style="line-height:1.9;">ارفع ملف Excel/CSV يحتوي عمودين على الأقل: «الرقم الجامعي» و«الحالة» (بالنص: ناجح / ملحق / غير مسموح بالتسجيل). سيُستخدم هذا لتحديد أهلية كل طالب للتسجيل في الفصل التالي.</p>
    <div class="field"><label for="cl-file">ملف النتيجة</label><input type="file" id="cl-file" accept=".xlsx,.xls,.csv"></div>
    <div class="err-text" id="cl-err"></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-gold" onclick="submitImportClearance('${semId}')">استيراد</button>
  `);
}
function normalizeClearanceStatus(s){
  const t = String(s||'');
  if(/ملحق/.test(t)) return 'supplementary';
  if(/ناجح|ok|pass/i.test(t)) return 'pass';
  return 'blocked';
}
async function submitImportClearance(semId){
  const fileInput = document.getElementById('cl-file');
  const err = document.getElementById('cl-err'); err.classList.remove('show');
  if(!fileInput.files[0]){ err.textContent='الرجاء اختيار ملف'; err.classList.add('show'); return; }
  let rows;
  try{ rows = await readSpreadsheetRows(fileInput.files[0]); }
  catch(e){ err.textContent='تعذّر قراءة الملف'; err.classList.add('show'); return; }
  if(!rows.length){ err.textContent='الملف فارغ'; err.classList.add('show'); return; }
  const idKey = findColumnKey(rows[0], ['الرقمالجامعي','رقمجامعي','رقمالتسجيل','id']);
  const statusKey = findColumnKey(rows[0], ['الحالة','النتيجة','status']);
  if(!idKey || !statusKey){ err.textContent='تعذّر العثور على عمودي «الرقم الجامعي» و«الحالة» في الملف'; err.classList.add('show'); return; }
  const students = await dbGetAll('students');
  let matched=0, unmatched=0, skippedEmpty=0;
  for(const row of rows){
    const sid = String(row[idKey]||'').trim();
    const statusText = String(row[statusKey]||'').trim();
    if(!sid || !statusText){ skippedEmpty++; continue; }
    const student = students.find(s=>s.id===sid || s.regNo===sid);
    if(!student){ unmatched++; continue; }
    const status = normalizeClearanceStatus(statusText);
    await dbPut('academicClearance', {id: student.id+'__'+semId, studentId:student.id, semesterId:semId, status, note: statusText, importedAt:new Date().toISOString(), importedBy:currentUser.username});

    // النجاح يُرقّي مستوى الطالب تلقائيًا (مرة واحدة فقط لكل فصل، تجنبًا للترقية
    // المضاعفة عند إعادة استيراد نفس الملف)، و«ملحق» يضع عائق تجميد مستقل لا
    // يُرفع إلا يدويًا من الموظف («فك تجميد») ولو صدر استيراد لاحق.
    const fresh = await dbGet('students', student.id);
    if(status==='pass'){
      const advancedFor = new Set(fresh.levelAdvancedForSemesters||[]);
      if(!advancedFor.has(semId)){
        fresh.currentLevel = (fresh.currentLevel||1) + 1;
        advancedFor.add(semId);
        fresh.levelAdvancedForSemesters = [...advancedFor];
        fresh.updatedAt = new Date().toISOString();
        await dbPut('students', fresh);
      }
    } else if(status==='supplementary'){
      const flags = fresh.blockFlags||[];
      const already = flags.some(f=> f.type==='supplementary' && f.semesterId===semId && !f.liftedAt);
      if(!already){
        flags.push({id:uid(), type:'supplementary', note:statusText, semesterId:semId,
          setAt:new Date().toISOString(), setBy:currentUser.username, liftedAt:null, liftedBy:null, liftNote:null});
        fresh.blockFlags = flags; fresh.updatedAt = new Date().toISOString();
        await dbPut('students', fresh);
      }
    }
    matched++;
  }
  await addLog('استيراد نتيجة فصل لاعتماد التسجيل', `فصل ${semId} — ${matched} مطابقة، ${unmatched} غير مطابقة`);
  closeModal();
  toast(`تم الاستيراد: ${matched} طالب مطابق، ${unmatched} غير مطابق`);
  navigate('semesters');
}

async function renderSemesterDetail(){
  const semId = viewParams.id;
  const sem = await dbGet('semesters', semId);
  const vp = document.getElementById('viewport');
  if(!sem){ vp.innerHTML = `<div class="card empty-state"><div class="icon">⚠️</div><h3>الفصل الدراسي غير موجود</h3></div>`; return; }
  const scope = myCollegeScope();
  const courses = (await dbGetAll('courses')).filter(c=> !scope || c.college===scope);
  let offerings = await dbGetAllByIndex('offerings','semesterId', semId);

/* ==================== ترقية أي تسجيلات قديمة بقائمة انتظار (مخلَّفة من نظام الشعب السابق) ====================
   لم يعد هناك سعة قصوى للمواد بعد إلغاء الشُعب، لذا لا يُنشأ أي تسجيل جديد بحالة
   "قائمة انتظار" — تبقى هذه الدالة فقط لترقية أي صفوف قديمة (إن وُجدت) مباشرة. */
async function promoteWaitlistForOfferings(offeringIds){
  for(const offeringId of (offeringIds||[])){
    const off = await dbGet('offerings', offeringId);
    if(!off) continue;
    const offRegs = await dbGetAllByIndex('registrations','offeringId', offeringId);
    const waiting = offRegs.filter(r=>r.status==='waitlisted').sort((a,b)=> new Date(a.registeredAt)-new Date(b.registeredAt));
    for(const promote of waiting){
      let newStatus = 'pending';
      if(promote.requestId){
        const req = await dbGet('registrationRequests', promote.requestId);
        if(req && req.status==='approved') newStatus = 'registered';
      }
      promote.status = newStatus;
      await dbPut('registrations', promote);
      await addLog('ترقية من قائمة الانتظار', `${promote.studentId} → ${offeringId} (${newStatus==='registered'?'معتمد':'قيد المراجعة'})`);
    }
  }
}
async function recordAdditionalPayment(requestId){
  const req = await dbGet('registrationRequests', requestId);
  if(!req) return;
  const amountEl = document.getElementById('rr-topup-amount');
  const noteEl = document.getElementById('rr-topup-note');
  const amount = Number(amountEl.value)||0;
  const remaining = req.remainingAmount||0;
  if(amount<=0 || amount>remaining){ toast('المبلغ غير صالح — يجب ألا يتجاوز المبلغ المتبقي', true); return; }
  req.amountPaid = (Number(req.amountPaid)||0) + amount;
  req.remainingAmount = Math.max(0, (Number(req.totalDue)||0) - req.amountPaid);
  req.paymentHistory = req.paymentHistory || [];
  req.paymentHistory.push({amount, note: noteEl.value.trim()||null, recordedBy: currentUser.username, recordedAt: new Date().toISOString()});
  await dbPut('registrationRequests', req);
  await addLog('تسجيل دفعة إضافية', `${req.studentId} — ${req.id} — ${amount}`);
  toast('تم تسجيل الدفعة');
  closeModal();
  navigate('registrations',{semId:req.semesterId});
}
async function reviewRequest(requestId, decision){
  const req = await dbGet('registrationRequests', requestId);
  const note = document.getElementById('rr-note') ? document.getElementById('rr-note').value.trim() : '';
  req.status = decision; req.reviewedBy = currentUser.username; req.reviewedAt = new Date().toISOString(); req.reviewNote = note||null;
  await dbPut('registrationRequests', req);
  const regs = await dbGetAllByIndex('registrations','requestId', requestId);
  for(const r of regs){
    if(decision==='approved'){ if(r.status==='pending') r.status='registered'; /* صفوف قائمة الانتظار تبقى كما هي حتى يتوفر مقعد فعلي */ }
    else { r.status = 'rejected'; }
    await dbPut('registrations', r);
  }
  if(decision==='rejected'){ await promoteWaitlistForOfferings(req.offeringIds); }
  await addLog(decision==='approved'?'اعتماد طلب تسجيل':'رفض طلب تسجيل', `${req.studentId} — ${req.id}`);
  closeModal(); toast(decision==='approved'?'تم اعتماد التسجيل':'تم رفض الطلب'); navigate('registrations',{semId:req.semesterId});
}

  const maxLevelCount = Math.max(1, ...Object.values(byLevel));

    if(!isNaN(na) && !isNaN(nb)) return na-nb;
    return String(a[0]).localeCompare(String(b[0]));
  });
  const bySpec = {};
  students.forEach(s=>{ const sp = s.specialization||s.department||'—'; bySpec[sp] = (bySpec[sp]||0)+1; });
  const maxSpecCount = Math.max(1, ...Object.values(bySpec));

async function submitAddUser(){

  closeModal(); toast('تم إنشاء المستخدم'); navigate('users');

async function exportFullBackup(){
  const stores = ['students','departments','courses','curricula','semesters','offerings','registrations','registrationRequests','academicClearance','users','logs'];
  const data = {};
  for(const s of stores){ data[s] = await dbGetAll(s); }
  data.__meta = {system:'zalingei_registration', version:DB_VERSION, exportedAt:new Date().toISOString()};
  downloadFile(`نسخة_احتياطية_نظام_التسجيل_${todayISO()}.json`, JSON.stringify(data,null,2));
  await addLog('تصدير نسخة احتياطية كاملة');
  toast('تم تنزيل النسخة الاحتياطية');
}
async function importFullBackup(file){
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const stores = ['students','departments','courses','curricula','semesters','offerings','registrations','registrationRequests','academicClearance','users','logs'];
    for(const s of stores){ if(Array.isArray(data[s])){ for(const row of data[s]){ await dbPut(s, row); } } }
    await addLog('استيراد نسخة احتياطية');
    toast('تم الاستيراد بنجاح'); navigate('settings');
  }catch(e){ toast('تعذّر قراءة الملف — تأكد أنه نسخة احتياطية صحيحة', true); }
}

/* ==================== بوابة الطالب: التحقق من أهلية التسجيل ====================
   يُمنع تسجيل الفصل القادم إن وُجد أيٌّ من الآتي:
     1) عائق مستقل فعّال على سجل الطالب (حالة غش / عائق مالي / ملحق لم يُرفَع
        بعد) — عوائق تُدار يدويًا ولا تُرفع إلا بإجراء "فك تجميد" من الموظف.
        هذا الشرط يُفحص دائمًا بلا استثناء، بصرف النظر عن رقم الفصل القادم.
     2) نتيجة آخر فصل دراسي سجَّل به الطالب فعليًا (registered) غير معتمدة بعد،
        أو رسوب — لكن هذا الشرط لا يُفحص إلا عند التسجيل لفصل دراسي فردي
        (الثالث، الخامس، السابع، التاسع، الحادي عشر...)، أي فقط حين تكون
        نتيجة فصلين متتاليين قد استُكملت. الفصول الزوجية (الثاني، الرابع...)
        لا تتطلب أي نتيجة معتمدة مسبقًا. يُفحص فصل واحد فقط عادةً؛ فإن كانت
        نتيجة ذلك الفصل "ملحق" يُفحص الفصل الذي قبله أيضًا (فصلان) تحسبًا
        لتعثّر متكرر لم يُحسم بعد.
     3) للطلاب الذين لا يملكون سجل تسجيل داخل النظام أصلاً (طلاب حاليون تم
        استيرادهم بأداة "إضافة مجموعة طلاب") يُستعان بدلًا من ذلك بحقلي
        الطالب priorResultStatus/priorResultForLevel (نتيجة احتياطية مُدخَلة
        عند الاستيراد) بشرط أن تُطابق نفس المستوى الحالي بالضبط. */
async function checkSemesterClearance(studentId, semesterId){
  const rec = await dbGet('academicClearance', studentId+'__'+semesterId);
  if(!rec) return {ok:false, reason:'missing'};
  if(rec.status==='blocked') return {ok:false, reason:'رسوب', note:rec.note};
  if(rec.status==='supplementary') return {ok:true, supplementary:true, note:rec.note};
  return {ok:true};
}
async function getStudentClearanceForRegistration(studentId){
  const student = await dbGet('students', studentId);
  const reasons = [];

  // 1) عوائق مستقلة قائمة على سجل الطالب — تُفحص دائمًا بلا استثناء
  activeFlags(student).forEach(f=>{
    const t = FLAG_TYPES[f.type] || {label:f.type};
    reasons.push({type:f.type, label:t.label, note:f.note});
  });

  const currentLevel = student.currentLevel||1;
  const nextLevel = currentLevel+1;
  // قاعدة جديدة: نتيجة معتمدة مطلوبة فقط عند التسجيل لفصل دراسي فردي
  // (٣، ٥، ٧، ٩، ١١...). الفصول الزوجية لا تتطلب أي نتيجة مسبقة.
  const resultGateApplies = nextLevel>=3 && (nextLevel%2===1);

  if(!resultGateApplies){
    return {ok: reasons.length===0, reasons, level: currentLevel, resultGateApplies:false};
  }

  // 2) نتيجة آخر فصل (أو فصلين) سجَّل بهما الطالب فعليًا (معتمَد) داخل النظام
  const allSemesters = await dbGetAll('semesters');
  const myRegs = (await dbGetAllByIndex('registrations','studentId', studentId)).filter(r=> r.status==='registered');
  const mySemesterIds = [...new Set(myRegs.map(r=>r.semesterId))];
  const myPastSemesters = allSemesters.filter(s=> mySemesterIds.includes(s.id))
    .sort((a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0));

  if(myPastSemesters.length){
    const lastSem = myPastSemesters[0];
    const lastCheck = await checkSemesterClearance(studentId, lastSem.id);
    if(!lastCheck.ok){
      reasons.push({type:lastCheck.reason==='missing'?'missing':'رسوب',
        label: lastCheck.reason==='missing' ? `لم تُعتمد بعد نتيجة الفصل السابق (${lastSem.name})` : `رسوب في الفصل السابق (${lastSem.name})`,
        note: lastCheck.note});
    }
    if(lastCheck.supplementary && myPastSemesters[1]){
      const prevSem = myPastSemesters[1];
      const prevCheck = await checkSemesterClearance(studentId, prevSem.id);
      if(!prevCheck.ok){
        reasons.push({type:prevCheck.reason==='missing'?'missing':'رسوب',
          label: prevCheck.reason==='missing' ? `لم تُعتمد بعد نتيجة الفصل الذي قبل السابق (${prevSem.name})` : `رسوب في الفصل الذي قبل السابق (${prevSem.name})`,
          note: prevCheck.note});
      }
    }
    return {ok: reasons.length===0, reasons, level: currentLevel, lastSem, resultGateApplies:true};
  }

  // 3) لا يوجد سجل تسجيل داخل النظام إطلاقًا — على الأرجح طالب حالي تم
  //    استيراده عبر أداة "إضافة مجموعة طلاب"؛ استخدم النتيجة الاحتياطية إن
  //    وُجدت وطابقت نفس المستوى الحالي بالضبط (تفاديًا لإعادة استخدام نتيجة
  //    قديمة أو غير متعلقة بهذا الفصل تحديدًا)
  if(student.priorResultStatus && student.priorResultForLevel===currentLevel){
    if(student.priorResultStatus==='blocked'){
      reasons.push({type:'رسوب', label:'رسوب وفق النتيجة المستوردة سابقًا', note: student.priorResultNote||''});
    } else if(student.priorResultStatus==='supplementary'){
      // ملحق كنتيجة احتياطية: نقبله دون طلب فصل إضافي إذ لا نملك تاريخًا
      // أعمق من هذه النتيجة الاحتياطية الوحيدة المتاحة.
    }
    return {ok: reasons.length===0, reasons, level: currentLevel, resultGateApplies:true, usedPriorResult:true};
  }

  reasons.push({type:'missing', label:'لا توجد نتيجة معتمدة أو مستوردة لهذا الطالب تُخوّله التسجيل لهذا الفصل'});
  return {ok: reasons.length===0, reasons, level: currentLevel, firstTime:true, resultGateApplies:true};
}

/* ==================== بوابة الطالب: التسجيل الفصلي ====================
   لا يختار الطالب مقرراته: النظام يحدّد تلقائيًا مقررات مستواه الحالي من
   منهج قسمه (تبويب «المناهج الدراسية») ويعرضها جاهزةً للتسجيل بضغطة واحدة. */
async function renderMyRegistration(){
  const student = await dbGet('students', currentUser.id);
  // نرتّب الفصول المفتوحة زمنيًا حسب تاريخ إنشائها (الأحدث أولاً) بدل الاعتماد
  // على ترتيب المفاتيح العشوائي في IndexedDB، ليكون الفصل الافتراضي منطقيًا.
  const openSemesters = (await dbGetAll('semesters')).filter(s=>s.regOpen).sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0));
  const semId = viewParams.semId || (openSemesters[0]||{}).id || '';
  const vp = document.getElementById('viewport');
  if(!semId){ vp.innerHTML = `<div class="card empty-state"><div class="icon">📭</div><h3>لا يوجد فصل دراسي مفتوح للتسجيل حاليًا</h3></div>`; return; }
  const sem = await dbGet('semesters', semId);
  const semPickerHtml = openSemesters.length>1 ? `<div class="field" style="max-width:340px;"><label>اختر الفصل الدراسي</label><select onchange="navigate('myregistration',{semId:this.value})">${openSemesters.map(s=>`<option value="${s.id}" ${s.id===semId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>` : '';
  const semFinanceHtml = `<div class="hint-box" style="text-align:start;line-height:2;">
    <div>فترة التسجيل: <b>${fmtDate(sem.regStart)} — ${fmtDate(sem.regEnd)}</b></div>
    ${(sem.regFee||sem.tuitionFee)? `<div>رسوم التسجيل: <b>${fmtMoney(sem.regFee)}</b> · المصروفات الدراسية: <b>${fmtMoney(sem.tuitionFee)}</b> · المجموع: <b>${fmtMoney((Number(sem.regFee)||0)+(Number(sem.tuitionFee)||0))}</b></div>`:''}
    ${sem.bankInfo? `<div>جهة/حساب سداد الرسوم: <b>${escapeHtml(sem.bankInfo)}</b></div>`:''}
  </div>`;

  const clearance = await getStudentClearanceForRegistration(student.id);
  if(!clearance.ok){
    vp.innerHTML = `<div class="card">${semPickerHtml}<div class="empty-state"><div class="icon">🔒</div><h3>لا يمكن فتح التسجيل الآن</h3>
      ${clearance.reasons.map(r=>`<div class="hint-box warn-box" style="text-align:start;">${escapeHtml(r.label)}${r.note?' — '+escapeHtml(r.note):''}</div>`).join('')}
      <p class="muted">يرجى مراجعة إدارة القبول والتسجيل لحل ما سبق قبل التسجيل.</p>
    </div></div>`;
    return;
  }

  const requests = (await dbGetAllByIndex('registrationRequests','studentId', student.id)).filter(r=>r.semesterId===semId);
  const activeReq = requests.find(r=>r.status==='pending') || requests.find(r=>r.status==='approved');
  const rejectedReq = !activeReq ? requests.slice().sort((a,b)=> new Date(b.submittedAt)-new Date(a.submittedAt))[0] : null;
  const courses = await dbGetAll('courses');

  if(activeReq){
    const offerings = await Promise.all(activeReq.offeringIds.map(id=>dbGet('offerings', id)));
    const regsForReq = await dbGetAllByIndex('registrations','requestId', activeReq.id);
    const anyWaitlisted = regsForReq.some(r=>r.status==='waitlisted');
    vp.innerHTML = `
      <div class="card">
        <h2>التسجيل الفصلي — ${escapeHtml(sem.name)}</h2>
        ${semPickerHtml}
        ${semFinanceHtml}
        <div class="hint-box ${activeReq.status==='approved'?'good-box':''}">
          حالة الطلب: <b>${activeReq.status==='approved'?'معتمد ✅':'قيد المراجعة المالية ⏳'}</b>
          ${activeReq.status==='pending'? ' — سيتم إعلامك بعد مراجعة إشعار التوريد من إدارة القبول والتسجيل.' : ''}
          ${anyWaitlisted? ' يتضمن هذا الطلب مقررًا واحدًا أو أكثر بقائمة الانتظار — سيُسجَّل تلقائيًا فور توفر مقعد.' : ''}
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>المقرر</th><th>الساعات</th><th>الحالة</th></tr></thead>
          <tbody>${offerings.filter(Boolean).map(o=>{
            const c=courses.find(x=>x.id===o.courseId);
            const reg = regsForReq.find(r=>r.offeringId===o.id);
            const st = reg ? reg.status : 'pending';
            const pill = st==='registered' ? '<span class="pill pill-good">معتمد</span>'
              : st==='waitlisted' ? '<span class="pill pill-mid">قائمة انتظار</span>'
              : '<span class="pill pill-gold">قيد المراجعة</span>';
            return `<tr><td>${escapeHtml(c?c.name:'')}</td><td>${c?c.creditHours:''}</td><td>${pill}</td></tr>`;
          }).join('')}</tbody>
        </table></div>
        <p class="muted" style="margin-top:10px;">رقم الإيصال المُدخل: ${escapeHtml(activeReq.receiptNumber||'—')}</p>
        ${activeReq.totalDue>0? `<div class="hint-box ${activeReq.remainingAmount>0?'warn-box':''}" style="text-align:start;">
          إجمالي المستحق: <b>${fmtMoney(activeReq.totalDue)}</b> · المدفوع: <b>${fmtMoney(activeReq.amountPaid)}</b> · المتبقي: <b>${fmtMoney(activeReq.remainingAmount)}</b>
          ${activeReq.isPartialPayment? `<br>دفعة جزئية (حالة خاصة): ${escapeHtml(activeReq.partialReason||'')}`:''}
        </div>`:''}
        ${activeReq.status==='pending'? `<button class="btn btn-outline btn-sm" onclick="cancelPendingRequest('${activeReq.id}','${semId}')">إلغاء الطلب</button>` : `<p class="muted">لإضافة أو حذف مقررات بعد الاعتماد، يرجى مراجعة إدارة القبول والتسجيل.</p>`}
      </div>
    `;
    return;
  }

  const level = student.currentLevel || 1;
  const curriculum = student.departmentId ? await dbGet('curricula', student.departmentId+'__'+level) : null;
  const curriculumCourses = curriculum ? (curriculum.courseIds||[]).map(cid=>courses.find(c=>c.id===cid)).filter(Boolean) : [];
  const offerings = await dbGetAllByIndex('offerings','semesterId', semId);
  const allRegs = await dbGetAll('registrations');

  const rows = curriculumCourses.map(c=>{
    const off = offerings.find(o=>o.courseId===c.id);
    let status='ready', note='';
    const missingPrereqs = (c.prerequisites||[]).filter(pid=> !(student.completedCourses||[]).includes(pid));
    if(!off){ status='missing'; note='لم تُضَف بعد هذه المادة لهذا الفصل الدراسي'; }
    else if(missingPrereqs.length){
      status='missing_prereq';
      const names = missingPrereqs.map(pid=>{ const pc=courses.find(x=>x.id===pid); return pc?(pc.code+' — '+pc.name):pid; }).join('، ');
      note = `لم يُسجَّل بعد كمُجتاز المتطلب السابق: ${names}`;
    }
    return {course:c, offering:off, status, note};
  });
  // المقررات "الجاهزة" فقط قابلة للتسجيل — أي التي أُضيفت فعلًا لهذا الفصل الدراسي
  // ولا يوجد لها متطلب سابق غير مُجتاز بعد؛ "missing" لم تُضَف بعد، و"missing_prereq"
  // مرهونة برصد المتطلب السابق كمُجتاز في "المقررات المجتازة" بملف الطالب أولًا.
  const readyRows = rows.filter(r=>r.status==='ready');
  const totalHours = rows.filter(r=>r.status==='ready').reduce((s,r)=>s+(r.course.creditHours||0),0);
  const totalDue = (Number(sem.regFee)||0)+(Number(sem.tuitionFee)||0);

  vp.innerHTML = `
    <div class="card">
      <h2>التسجيل الفصلي — ${escapeHtml(sem.name)}</h2>
      ${semPickerHtml}
      ${semFinanceHtml}
      ${rejectedReq? `<div class="hint-box warn-box">تم رفض طلبك السابق${rejectedReq.reviewNote?': '+escapeHtml(rejectedReq.reviewNote):''}. يمكنك تقديم طلب جديد بإيصال صحيح أدناه.</div>`:''}
      <div class="hint-box">مقرراتك هذا الفصل ثابتة حسب منهج ${semesterLabel(level)} لقسمك، ولا حاجة لاختيار الساعات يدويًا. يتطلب التسجيل إرفاق رقم إيصال التوريد المالي وصورة/ملف الإيصال.</div>
      ${!curriculum? `<div class="hint-box warn-box">لم يُحدَّد بعد منهج ${semesterLabel(level)} لقسمك — يرجى مراجعة إدارة القبول والتسجيل.</div>` : ''}
      <div class="table-wrap"><table>
        <thead><tr><th>المقرر</th><th>الساعات</th><th>الحالة</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${escapeHtml(r.course.code)} — ${escapeHtml(r.course.name)}</td>
          <td>${r.course.creditHours}</td>
          <td>${r.status==='ready'? '<span class="pill pill-good">جاهز</span>' : `<span class="pill pill-warn">${escapeHtml(r.note)}</span>`}</td>
        </tr>`).join('') || `<tr><td colspan="3" class="muted" style="text-align:center;padding:20px;">لا توجد مقررات محدَّدة بعد لمستواك</td></tr>`}
        </tbody>
      </table></div>
      <p class="muted" style="margin-top:8px;">إجمالي الساعات القابلة للتسجيل الآن: <b>${totalHours}</b></p>
    </div>
    <div class="card">
      <h3>البيانات المالية</h3>
      <div class="row2">
        <div class="field"><label for="reg-receipt-no">رقم الإيصال / إشعار التوريد</label><input id="reg-receipt-no" placeholder="مثال: 20260001"></div>
        <div class="field"><label for="reg-receipt-file">صورة/ملف الإيصال</label><input type="file" id="reg-receipt-file" accept="image/*,.pdf"></div>
      </div>
      ${totalDue>0? `
      <div class="row2">
        <div><div class="muted">إجمالي المبلغ المستحق لهذا الفصل</div><div><b>${fmtMoney(totalDue)}</b></div></div>
        <div class="field"><label for="reg-amount-paid">المبلغ المدفوع</label><input id="reg-amount-paid" type="number" min="0" value="${totalDue}" disabled onchange="document.getElementById('reg-partial-box').style.display = (Number(this.value)<${totalDue})?'block':'none';"></div>
      </div>
      <div class="checkrow"><input type="checkbox" id="reg-partial" onchange="document.getElementById('reg-partial-box').style.display=this.checked?'block':'none'; if(this.checked){document.getElementById('reg-amount-paid').removeAttribute('disabled');} else {document.getElementById('reg-amount-paid').value=${totalDue}; document.getElementById('reg-amount-paid').setAttribute('disabled','disabled');}"><label for="reg-partial">دفعة جزئية (حالة خاصة تتطلب مسوّغًا) — الأصل أن يكون السداد كاملاً دفعة واحدة</label></div>
      <div id="reg-partial-box" style="display:none;">
        <div class="field"><label for="reg-partial-reason">سبب الدفع الجزئي (مطلوب)</label><input id="reg-partial-reason" placeholder="مثال: تعثّر مالي مؤقت بموافقة عمادة شؤون الطلاب"></div>
      </div>
      ` : ''}
      <div class="err-text" id="reg-err"></div>
    </div>
    <div class="card" style="position:sticky;bottom:10px;">
      <button class="btn btn-gold btn-block" ${readyRows.length?'':'disabled'} onclick="submitRegistration('${semId}')">تسجيل الفصل القادم</button>
    </div>
  `;
  window.__regReadyRows = readyRows;
}
async function cancelPendingRequest(requestId, semId){
  const req = await dbGet('registrationRequests', requestId);
  req.status = 'rejected'; req.reviewNote = 'ألغاه الطالب لتعديل الاختيار'; req.reviewedAt = new Date().toISOString(); req.reviewedBy = currentUser.id;
  await dbPut('registrationRequests', req);
  const regs = await dbGetAllByIndex('registrations','requestId', requestId);
  for(const r of regs){ r.status='rejected'; await dbPut('registrations', r); }
  await promoteWaitlistForOfferings(req.offeringIds);
  await addLog('إلغاء طلب تسجيل من الطالب', requestId);
  toast('تم إلغاء الطلب، يمكنك تقديم طلب جديد الآن');
  navigate('myregistration',{semId});
}
async function submitRegistration(semId){
  const student = await dbGet('students', currentUser.id);
  const sem = await dbGet('semesters', semId);
  const now = todayISO();
  const withinWindow = (!sem.regStart || now>=sem.regStart) && (!sem.regEnd || now<=sem.regEnd);
  const err = document.getElementById('reg-err'); if(err) err.classList.remove('show');
  if(!sem.regOpen || !withinWindow){ toast('فترة التسجيل غير مفتوحة حاليًا', true); return; }

  // إعادة التحقق من أهلية الطالب لحظة الإرسال (وليس فقط عند فتح الصفحة)
  const clearance = await getStudentClearanceForRegistration(student.id);
  if(!clearance.ok){ toast('لم يعد بالإمكان إتمام التسجيل — راجع إدارة القبول والتسجيل', true); navigate('myregistration',{semId}); return; }

  const readyRows = window.__regReadyRows||[];
  if(!readyRows.length){ toast('لا توجد مقررات جاهزة للتسجيل حاليًا', true); return; }

  const receiptNumber = document.getElementById('reg-receipt-no').value.trim();
  const receiptFileInput = document.getElementById('reg-receipt-file');
  const receiptFile = receiptFileInput.files[0];
  if(!receiptNumber){ toast('الرجاء إدخال رقم الإيصال', true); return; }
  if(!receiptFile){ toast('الرجاء إرفاق صورة/ملف الإيصال', true); return; }

  // البيانات المالية: السداد كامل افتراضيًا؛ الدفعة الجزئية حالة استثنائية تتطلب مسوّغًا
  const totalDue = (Number(sem.regFee)||0)+(Number(sem.tuitionFee)||0);
  let amountPaid = totalDue, isPartialPayment = false, partialReason = null;
  if(totalDue>0){
    const partialEl = document.getElementById('reg-partial');
    isPartialPayment = partialEl ? partialEl.checked : false;
    amountPaid = Number(document.getElementById('reg-amount-paid').value)||0;
    if(isPartialPayment){
      partialReason = document.getElementById('reg-partial-reason').value.trim();
      if(!partialReason){ toast('الرجاء إدخال سبب الدفعة الجزئية', true); return; }
      if(amountPaid<=0 || amountPaid>=totalDue){ toast('المبلغ المدفوع في حالة الدفع الجزئي يجب أن يكون أقل من إجمالي المستحق وأكبر من صفر', true); return; }
    } else {
      amountPaid = totalDue;
    }
  }

  const totalHours = readyRows.reduce((s,r)=>s+(r.course.creditHours||0),0);
  const requestId = uid();
  const request = {
    id: requestId, studentId: student.id, semesterId: semId, college: student.college,
    offeringIds: readyRows.map(r=>r.offering.id), totalHours,
    receiptNumber, receiptFile, receiptFileName: receiptFile.name,
    totalDue, amountPaid, remainingAmount: Math.max(0, totalDue-amountPaid), isPartialPayment, partialReason,
    paymentHistory: isPartialPayment ? [{amount:amountPaid, note:'الدفعة الأولى عند التسجيل', recordedBy: student.id, recordedAt:new Date().toISOString()}] : [],
    submittedAt: new Date().toISOString(), status:'pending', reviewedBy:null, reviewedAt:null, reviewNote:null,
  };
  await dbPut('registrationRequests', request);
  for(const r of readyRows){
    await dbPut('registrations', {id:uid(), studentId:student.id, semesterId:semId, offeringId:r.offering.id, courseId:r.course.id, creditHours:r.course.creditHours, status:'pending', requestId, registeredAt:new Date().toISOString()});
  }
  await addLog('تقديم طلب تسجيل فصلي', `${student.name} — ${sem.name} (${totalHours} ساعة)`);
  toast('تم إرسال طلب التسجيل، بانتظار اعتماد شؤون الطلاب للجانب المالي');
  navigate('myregistration',{semId});
}

async function renderMyHistory(){
  const student = await dbGet('students', currentUser.id);
  const regs = (await dbGetAllByIndex('registrations','studentId', currentUser.id)).filter(r=>r.status==='registered'||r.status==='pending'||r.status==='waitlisted');
  const semesters = await dbGetAll('semesters'); const courses = await dbGetAll('courses');
  const bySem = {};
  regs.forEach(r=>{ (bySem[r.semesterId] = bySem[r.semesterId]||[]).push(r); });
  document.getElementById('viewport').innerHTML = `
    <div class="card">
      <h2>سجل تسجيلاتي</h2>
      ${Object.entries(bySem).map(([semId, rows])=>{
        const sem = semesters.find(s=>s.id===semId);
        const totalHours = rows.filter(r=>r.status!=='waitlisted').reduce((s,r)=>s+r.creditHours,0);
        const anyRegistered = rows.some(r=>r.status==='registered');
        const anyPending = rows.some(r=>r.status==='pending');
        const anyWaitlisted = rows.some(r=>r.status==='waitlisted');
        return `<div style="margin-bottom:18px;">
          <h3>${escapeHtml(sem?sem.name:'—')} <span class="muted">(${totalHours} ساعة)</span>
            ${anyRegistered? `<button class="btn btn-outline btn-sm" onclick="printRegistrationSlip('${semId}')" style="margin-inline-start:8px;">🖨️ طباعة إشعار التسجيل (المعتمد فقط)</button>` : ''}
            ${anyPending? `<span class="pill pill-gold" style="margin-inline-start:8px;">قيد المراجعة المالية</span>`:''}
            ${anyWaitlisted? `<span class="pill pill-mid" style="margin-inline-start:8px;">قائمة انتظار</span>`:''}
          </h3>
          <div class="table-wrap"><table>
            <thead><tr><th>المقرر</th><th>الساعات</th><th>الحالة</th></tr></thead>
            <tbody>${rows.map(r=>{ const c=courses.find(x=>x.id===r.courseId); const pill = r.status==='registered'?'pill-good':(r.status==='waitlisted'?'pill-mid':'pill-gold'); const label = r.status==='registered'?'معتمد':(r.status==='waitlisted'?'قائمة انتظار':'قيد المراجعة'); return `<tr><td>${escapeHtml(c?c.name:'')}</td><td>${r.creditHours}</td><td><span class="pill ${pill}">${label}</span></td></tr>`; }).join('')}</tbody>
          </table></div>
        </div>`;
      }).join('') || `<div class="empty-state"><div class="icon">📖</div><h3>لا يوجد سجل تسجيل بعد</h3></div>`}
    </div>

/* ==================== شاشة إلزامية لتغيير كلمة المرور المؤقتة (طالب) ====================
   تظهر بدل أي شاشة أخرى (navigate يُعيد توجيه أي محاولة تصفح لهذه الشاشة طالما
   العلَم mustChangePassword فعّال) فور أول دخول بكلمة مرور مؤقتة، ولا يزول الحجب
   إلا بتغيير حقيقي لكلمة المرور. */
async function renderForceChangePassword(){
  document.getElementById('viewport').innerHTML = `
    <div class="card" style="max-width:480px;margin:30px auto;">
      <h2>🔐 يجب تغيير كلمة المرور المؤقتة</h2>
      <div class="hint-box warn-box">كلمة مرورك الحالية مؤقتة (صادرة عند تسجيلك أو عند إعادة تعيينها). لأسباب أمنية، يجب عليك اختيار كلمة مرور جديدة خاصة بك قبل متابعة استخدام النظام.</div>
      <div class="field"><label for="fc-old">كلمة المرور المؤقتة الحالية</label><input id="fc-old" type="password"></div>
      <div class="field"><label for="fc-new">كلمة المرور الجديدة</label><input id="fc-new" type="password"></div>
      <div class="field"><label for="fc-new2">تأكيد كلمة المرور الجديدة</label><input id="fc-new2" type="password"></div>
      <div class="err-text" id="fc-err"></div>
      <button class="btn btn-gold btn-block" onclick="submitForceChangePassword()">تحديث كلمة المرور والمتابعة</button>
    </div>
  `;
}
async function submitForceChangePassword(){
  const oldPw = document.getElementById('fc-old').value;
  const newPw = document.getElementById('fc-new').value;
  const newPw2 = document.getElementById('fc-new2').value;
  const err = document.getElementById('fc-err'); err.classList.remove('show');
  const verified = await verifyStudentLogin(currentUser.id, oldPw);
  if(!verified){ err.textContent='كلمة المرور المؤقتة الحالية غير صحيحة'; err.classList.add('show'); return; }
  const st = validatePasswordStrength(newPw);
  if(!st.ok){ err.textContent=st.msg; err.classList.add('show'); return; }
  if(newPw===oldPw){ err.textContent='الرجاء اختيار كلمة مرور مختلفة عن المؤقتة'; err.classList.add('show'); return; }
  if(newPw!==newPw2){ err.textContent='كلمتا المرور الجديدتان غير متطابقتين'; err.classList.add('show'); return; }
  await setStudentPassword(currentUser.id, newPw, false);
  try{
    if(supabaseClient && navigator.onLine){
      const { data } = await supabaseClient.auth.getUser();
      if(data && data.user && data.user.email===emailForStudentId(currentUser.id)){
        await withTimeout(supabaseClient.auth.updateUser({password:newPw}), 8000, 'SUPABASE_TIMEOUT');
      }
    }
  }catch(e){}
  await addLog('تغيير كلمة مرور مؤقتة إلزاميًا (أول دخول)');
  currentUser.mustChangePassword = false;
  toast('تم تحديث كلمة المرور بنجاح، مرحبًا بك 🎉');
  buildNav();
  navigate('dashboard');
}
async function changeMyPassword(){
  const oldPw = document.getElementById('pw-old').value;
  const newPw = document.getElementById('pw-new').value;
  const newPw2 = document.getElementById('pw-new2').value;
  const err = document.getElementById('pw-err'); err.classList.remove('show');
  const ok = document.getElementById('pw-ok'); ok.classList.remove('show');
  const st = validatePasswordStrength(newPw);
  if(currentUser.type==='staff'){
    const verified = await verifyStaffLogin(currentUser.username, oldPw);
    if(!verified){ err.textContent='كلمة المرور الحالية غير صحيحة'; err.classList.add('show'); return; }
    if(!st.ok){ err.textContent=st.msg; err.classList.add('show'); return; }
    if(newPw!==newPw2){ err.textContent='كلمتا المرور الجديدتان غير متطابقتين'; err.classList.add('show'); return; }
    const user = await dbGet('users', currentUser.username);
    const rec = await makeNewPasswordRecord(newPw);
    user.salt = rec.salt; user.hash = rec.hash; user.hashAlgo = rec.hashAlgo; user.hashIter = rec.hashIter; user.updatedAt = new Date().toISOString();
    await dbPut('users', user);
    try{
      if(supabaseClient && navigator.onLine){
        const { data } = await supabaseClient.auth.getUser();
        if(data && data.user && data.user.email===emailForUsername(currentUser.username)){
          await withTimeout(supabaseClient.auth.updateUser({password:newPw}), 8000, 'SUPABASE_TIMEOUT');
        }
      }
    }catch(e){}
    await addLog('تغيير كلمة مرور موظف (ذاتيًا)');
  } else {
    const verified = await verifyStudentLogin(currentUser.id, oldPw);
    if(!verified){ err.textContent='كلمة المرور الحالية غير صحيحة'; err.classList.add('show'); return; }
    if(!st.ok){ err.textContent=st.msg; err.classList.add('show'); return; }
    if(newPw!==newPw2){ err.textContent='كلمتا المرور الجديدتان غير متطابقتين'; err.classList.add('show'); return; }
    await setStudentPassword(currentUser.id, newPw, false);
    // إن كانت هناك جلسة Supabase Auth نشطة لهذا الحساب بالذات، حدِّث كلمة المرور
    // هناك أيضًا فورًا (هذا هو المسار الوحيد الآمن لتحديث كلمة مرور الحساب السحابي
    // بمفتاح anon فقط — تغيير المستخدم كلمة مروره بنفسه أثناء جلسة مصادقة صحيحة).
    try{
      if(supabaseClient && navigator.onLine){
        const { data } = await supabaseClient.auth.getUser();
        if(data && data.user && data.user.email===emailForStudentId(currentUser.id)){
          await withTimeout(supabaseClient.auth.updateUser({password:newPw}), 8000, 'SUPABASE_TIMEOUT');
        }
      }
    }catch(e){}
    await addLog('تغيير كلمة مرور طالب');
  }
  ok.textContent='تم تحديث كلمة المرور بنجاح'; ok.classList.add('show');
  document.getElementById('pw-old').value=''; document.getElementById('pw-new').value=''; document.getElementById('pw-new2').value='';
  refreshNotifBadge();
}
